        const FX_NAMES = {
            glitch: '글리치',
            typing: '타이핑',
            blind: '검열',
            shake: '흔들림',
            hl: '형광펜',
            neon: '네온',
            sparkle: '반짝'
        };
        const FMT_NAMES = {
            bold: '굵게',
            italic: '기울임',
            underline: '밑줄',
            strikeThrough: '취소선'
        };

        function fxAncestors(node) {
            const out = [];
            let n = node && node.nodeType === 3 ? node.parentNode : node;
            while (n && n.nodeType === 1 && !n.classList.contains('fv')) {
                out.push(n);
                n = n.parentNode;
            }
            return out;
        }

        function fxSpansIn(range, cls) {
            const set = new Set();
            const sel = cls ? '.' + cls : Object.keys(FX_NAMES).map(k => '.' + k).join(',');
            [range.startContainer, range.endContainer].forEach(c => fxAncestors(c).forEach(el => {
                if (el.matches(sel)) set.add(el);
            }));
            let root = range.commonAncestorContainer;
            if (root.nodeType === 3) root = root.parentNode;
            if (!range.collapsed) root.querySelectorAll(sel).forEach(el => {
                if (range.intersectsNode(el)) set.add(el);
            });
            return [...set];
        }

        function updateTextBar() {
            const bar = document.getElementById('text-bar');
            const r = selInPreview();
            const has = !!(r && !r.collapsed);
            if (has) savedTextRange = r.cloneRange();
            bar.classList.toggle('has-sel', has);
            const applied = [];
            bar.querySelectorAll('.tb-fmt').forEach(b => {
                let on = false;
                if (r) try {
                    on = document.queryCommandState(b.dataset.cmd);
                } catch (e) {}
                b.classList.toggle('on', on);
                if (on) applied.push(FMT_NAMES[b.dataset.cmd]);
            });
            const fx = new Set();
            if (r) fxSpansIn(r).forEach(el => Object.keys(FX_NAMES).forEach(k => {
                if (el.classList.contains(k)) fx.add(k);
            }));
            bar.querySelectorAll('[data-fx]').forEach(b => b.classList.toggle('on', fx.has(b.dataset.fx)));
            const fxNames = Object.keys(FX_NAMES).filter(k => fx.has(k)).map(k => FX_NAMES[k]);
            applied.push(...fxNames);
            const fb = document.getElementById('fx-btn');
            fb.classList.toggle('on', fxNames.length > 0);
            fb.innerHTML = fxNames.length ? `✨ ${fxNames.join('·')} ✓ <span class="fx-caret">▾</span>` : '✨ 효과 <span class="fx-caret">▾</span>';
            const hint = document.getElementById('tb-hint');
            hint.classList.toggle('applied', applied.length > 0);
            if (applied.length) hint.textContent = '✔ 적용됨: ' + applied.join(' · ') + '  (다시 누르면 해제)';
            else hint.textContent = has ? '고른 글자에 적용돼요' : '미리보기에서 글자를 드래그해 고른 뒤 눌러주세요';
        }
        document.addEventListener('selectionchange', updateTextBar);

        function unwrapEl(el) {
            const first = el.firstChild,
                last = el.lastChild;
            while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
            el.remove();
            return first ? [first, last] : null;
        }

        function selectNodes(first, last) {
            if (!first) return;
            const r = document.createRange();
            r.setStartBefore(first);
            r.setEndAfter(last);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(r);
        }

        function toggleFxMenu(force) {
            const pop = document.getElementById('fx-pop');
            const open = force === undefined ? !pop.classList.contains('open') : force;
            pop.classList.toggle('open', open);
            document.getElementById('fx-btn').classList.toggle('open', open);
        }
        document.addEventListener('mousedown', e => {
            if (!e.target.closest('.fx-wrap')) toggleFxMenu(false);
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                toggleFxMenu(false);
                closeModal();
            }
        });

        function applyEffect(cls) {
            toggleFxMenu(false);
            if (!restoreTextSel()) return showToast(NEED_SEL);
            const sel = window.getSelection();
            const range = sel.getRangeAt(0);
            const host = spanOfNode(range.startContainer);
            const existing = fxSpansIn(range, cls);
            if (existing.length) {
                let first = null,
                    last = null;
                existing.forEach(el => {
                    const fl = unwrapEl(el);
                    if (fl) {
                        if (!first) first = fl[0];
                        last = fl[1];
                    }
                });
                selectNodes(first, last);
                showToast('↩ ' + FX_NAMES[cls] + ' 효과를 풀었어요');
                commitSpan(host);
                updateTextBar();
                return;
            }
            if (range.collapsed) return showToast('✋ 효과를 넣을 글자를 드래그해 골라주세요.');
            if (spanOfNode(range.endContainer) !== host) return showToast('✋ 한 칸 안의 글자만 골라주세요.');
            const span = document.createElement('span');
            span.className = cls;
            span.appendChild(range.extractContents());
            range.insertNode(span);
            selectNodes(span, span);
            commitSpan(host);
            updateTextBar();
        }

        // ---- 저장 전 빈칸 확인 ----
        function isEmptyVal(k) {
            return !htmlToText(state.f[k] || '').trim();
        }

        // 켜져 있는 블럭에서 아직 안 적은 칸을 블럭별로 모음
        function emptyReport() {
            const blocks = [];
            const byId = {};
            const all = new Set();
            document.querySelectorAll('#capture-area .fv').forEach(sp => {
                if (sp.closest('.sec-off')) return;
                const k = sp.dataset.k;
                if (!isEmptyVal(k)) return;
                const sec = sp.closest('[data-sec]');
                const id = sec ? sec.dataset.sec : '_top';
                if (!byId[id]) {
                    const lab = id === '_top' ? '🔖 머리말 · 공통 칸' : ((SECTIONS[state.preset] || []).find(x => x[0] === id) || [id, id])[1];
                    byId[id] = {
                        id,
                        label: lab,
                        keys: []
                    };
                    blocks.push(byId[id]);
                }
                if (!byId[id].keys.includes(k)) byId[id].keys.push(k);
                all.add(k);
            });
            return {
                blocks,
                total: all.size
            };
        }

        let pendingExport = null;

        function guardExport(kind) {
            if (document.activeElement) document.activeElement.blur();
            const rep = emptyReport();
            const run = kind === 'png' ? doSaveImage : doCopyHTML;
            if (!rep.total) return run();
            pendingExport = run;
            const rows = rep.blocks.map(b => `<div class="empty-row"><div class="er-head">${esc(b.label)}<em>${b.keys.length}칸</em></div>
                <div class="er-chips">${b.keys.map(k => `<button onclick="gotoField('${esc(k)}','${b.id}')">${esc(FIELD[k] ? FIELD[k].label : k)}</button>`).join('')}</div></div>`).join('');
            openModal(`<button class="m-close" onclick="closeModal()" title="닫기">✕</button>
                <h2>빈칸이 ${rep.total}개 있어요</h2>
                <p class="m-sub">블럭 ${rep.blocks.length}곳에 아직 안 적은 칸이 있어요. <b>칸 이름을 누르면</b> 바로 적으러 가요.<br>안 쓸 블럭은 편집에서 꺼 두면 ${kind === 'png' ? '이미지' : 'HTML'}에서 빠져요.</p>
                <div class="empty-list">${rows}</div>
                <div class="m-actions"><button onclick="closeModal()">취소</button><button class="primary" onclick="runPendingExport()">${kind === 'png' ? '📷 그대로 저장' : '📋 그대로 복사'}</button></div>`);
        }

        function runPendingExport() {
            closeModal();
            const f = pendingExport;
            pendingExport = null;
            if (f) f();
        }

        // 빈칸 목록에서 누른 칸으로 바로 이동
        function gotoField(k, sec) {
            closeModal();
            openRows.add(sec);
            switchTab('grp-blocks');
            setTimeout(() => {
                const inp = document.querySelector(`details.blk[data-row="${sec}"] [data-k="${CSS.escape(k)}"]:not([data-role="range"])`);
                if (!inp) return;
                const area = document.getElementById('controls');
                if (window.innerWidth > 768) area.scrollTop += inp.getBoundingClientRect().top - area.getBoundingClientRect().top - 140;
                else window.scrollBy(0, inp.getBoundingClientRect().top - 120);
                inp.focus({
                    preventScroll: true
                });
                pingPreview(k, sec);

        function saveAsImage() {
            guardExport('png');

        async function doSaveImage() {
            if (document.activeElement) document.activeElement.blur();
            saveNow();
            const root = document.getElementById('capture-area').firstElementChild;
            if (!root) return;
            const dets = [...root.querySelectorAll('details')];
            const wasOpen = dets.map(d => d.open);
            const ps = document.getElementById('preview-scroll');
            const keep = ps.scrollTop;
            document.body.classList.add('exporting');
            dets.forEach(d => d.open = true);
            showToast('📷 이미지를 만드는 중이에요…');
            const prevMargin = root.style.margin;
            root.style.margin = '0';
            try {
                if (document.fonts && document.fonts.ready) await document.fonts.ready;
                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                let url;
                try {
                    if (!window.htmlToImage) throw new Error('no html-to-image');
                    let fontCSS = '';
                    try {
                        fontCSS = await buildFontEmbedCSS(root);
                    } catch (e) {
                        console.warn('글꼴 준비 실패', e);
                    }
                    url = await htmlToImage.toPng(root, {
                        pixelRatio: 2,
                        fontEmbedCSS: fontCSS
                    });
                } catch (err) {
                    console.warn('html-to-image 실패, html2canvas 로 다시 시도', err);
                    const canvas = await html2canvas(root, {
                        scale: 2,
                        backgroundColor: null,
                        useCORS: true
                    });
                    url = canvas.toDataURL('image/png');
                }
                const a = document.createElement('a');
                const nm = getSlotNames()[getSlotNum()];
                a.download = '상태창_' + String(nm || state.preset).replace(/[\/:*?"<>|.]/g, '_') + '.png';
                a.href = url;
                a.click();
                showToast('✅ 이미지를 저장했어요');
            } catch (e) {
                console.error(e);
                showToast('❌ 이미지 저장에 실패했어요.');
            } finally {
                root.style.margin = prevMargin;
                dets.forEach((d, i) => d.open = wasOpen[i]);
                document.body.classList.remove('exporting');
                ps.scrollTop = keep;
            }
        }

        // PNG 에 실제로 쓰인 글꼴·글자만 골라서 넣음 (전부 넣으면 너무 무거워짐)
        const fontDataCache = {};

        async function sheetRules(ss) {
            try {
                return [...ss.cssRules];
            } catch (e) {
                if (!ss.href) return [];
                try {
                    const txt = await (await fetch(ss.href)).text();
                    const tmp = new CSSStyleSheet();
                    tmp.replaceSync(txt.replace(/@import[^;]+;/g, ''));
                    return [...tmp.cssRules];
                } catch (e2) {
                    return [];
                }
            }
        }

        function parseWeight(w) {
            w = String(w || '400').trim();
            if (w === 'normal') return [400, 400];
            if (w === 'bold') return [700, 700];
            const n = w.split(/\s+/).map(Number);
            return [n[0], n[1] || n[0]];
        }

        function rangeHits(ur, codes) {
            if (!ur) return true;
            return ur.split(',').some(part => {
                const m = part.trim().replace(/^U\+/i, '');
                let a, b;
                if (m.includes('-'))[a, b] = m.split('-').map(x => parseInt(x, 16));
                else if (m.includes('?')) {
                    a = parseInt(m.replace(/\?/g, '0'), 16);
                    b = parseInt(m.replace(/\?/g, 'F'), 16);
                } else a = b = parseInt(m, 16);
                for (const c of codes)
                    if (c >= a && c <= b) return true;
                return false;
            });
        }

        async function toDataURL(url) {
            if (fontDataCache[url]) return fontDataCache[url];
            const blob = await (await fetch(url)).blob();
            const data = await new Promise((res, rej) => {
                const r = new FileReader();
                r.onload = () => res(r.result);
                r.onerror = rej;
                r.readAsDataURL(blob);
            });
            return fontDataCache[url] = data;
        }

        async function buildFontEmbedCSS(root) {
            const used = {}; // 글꼴 이름 → 쓰인 굵기들
            const els = [root, ...root.querySelectorAll('*')];
            els.forEach(el => {
                const cs = getComputedStyle(el);
                const w = parseInt(cs.fontWeight) || 400;
                cs.fontFamily.split(',').forEach(f => {
                    const nm = f.trim().replace(/^["']|["']$/g, '').toLowerCase();
                    (used[nm] = used[nm] || new Set()).add(w);
                });
            });
            const codes = new Set();
            for (const ch of root.textContent) codes.add(ch.codePointAt(0));
            const picked = [];
            for (const ss of document.styleSheets) {
                const base = ss.href || location.href;
                for (const r of await sheetRules(ss)) {
                    if (r.type !== CSSRule.FONT_FACE_RULE) continue;
                    const fam = r.style.getPropertyValue('font-family').trim().replace(/^["']|["']$/g, '');
                    const ws = used[fam.toLowerCase()];
                    if (!ws) continue;
                    const [lo, hi] = parseWeight(r.style.getPropertyValue('font-weight'));
                    const okW = [...ws].some(w => w >= lo && w <= hi) || (lo <= 400 && hi >= 400);
                    if (!okW) continue;
                    if (!rangeHits(r.style.getPropertyValue('unicode-range'), codes)) continue;
                    picked.push({
                        r,
                        base
                    });
                }
            }
            const out = await Promise.all(picked.map(async ({
                r,
                base
            }) => {
                const src = r.style.getPropertyValue('src');
                const m = src.match(/url\(\s*["']?([^"')]+)["']?\s*\)\s*(format\(\s*["']?([^"')]+)["']?\s*\))?/);
                if (!m) return '';
                try {
                    const url = new URL(m[1], base).href;
                    const data = await toDataURL(url);
                    const st = r.style;
                    return `@font-face{font-family:${st.getPropertyValue('font-family')};src:url(${data})${m[3] ? ` format("${m[3]}")` : ''};font-weight:${st.getPropertyValue('font-weight') || 'normal'};font-style:${st.getPropertyValue('font-style') || 'normal'};${st.getPropertyValue('unicode-range') ? 'unicode-range:' + st.getPropertyValue('unicode-range') + ';' : ''}}`;
                } catch (e) {
                    return '';
                }
            }));
            return out.join('\n');
        }

        // 완성본 HTML: 원래 디자인 그대로(접힌 칸은 접힌 채로) + 적어 둔 내용, 꺼 둔 블럭은 뺌
        function buildCleanHTML() {
            const tpl = TEMPLATES[state.preset];
            let body = tpl.replace(/<[^>]+>|\{\{([^}]+)\}\}/g, (m, k) => {
                if (k !== undefined) return state.f[k] || '';
                return m.replace(/\{\{([^}]+)\}\}/g, (mm, kk) => numOf(kk));
            });
            const tmp = document.createElement('div');
            tmp.innerHTML = body;
            tmp.querySelectorAll('[data-sec]').forEach(el => {
                if (isOff(el.dataset.sec)) el.remove();
                else el.removeAttribute('data-sec');
            });
            body = tmp.innerHTML;
            const allHtml = Object.values(state.f).join(' ');
            const usedFx = Object.keys(FX_NAMES).filter(c => new RegExp('class="[^"]*\\b' + c + '\\b').test(allHtml));
            let css = '';
            if (usedFx.length) css += FX_CSS_TEXT;
            let head = '';
            if (state.font && state.font !== 'preset') {
                const rules = [...document.styleSheets].flatMap(ss => {
                    try {
                        return [...ss.cssRules];
                    } catch (e) {
                        return [];
                    }
                }).map(r => r.cssText).filter(t => t.startsWith('[data-font="' + state.font + '"]') || t.startsWith('[data-font] [style*="monospace"]') || (t.startsWith('@font-face') && FONT_FACE_NEEDED[state.font] && t.includes(FONT_FACE_NEEDED[state.font])));
                css += rules.join('\n');
                if (FONT_LINKS[state.font]) head += `<link href="${FONT_LINKS[state.font]}" rel="stylesheet">\n`;
                body = `<div data-font="${state.font}">\n${body}\n</div>`;
            }
            if (css) head += `<style>\n:root{--pinkt:#d64973;--blue:#6baef2;--ink:#1a1a1a}\n${css}\n</style>\n`;
            return head + body;
        }
        const FONT_LINKS = {
            gothic: 'https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap',
            myeongjo: 'https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&display=swap',
            batang: 'https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap',
            orbitron: 'https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Gowun+Dodum&display=swap',
            suit: 'https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css'
        };
        const FONT_FACE_NEEDED = {
            ridi: 'RIDIBatang',
            pixel: 'NeoDunggeunmo',
            galmuri: 'Galmuri11',
            paperlogy: 'Paperlogy'
        };
        const FX_CSS_TEXT = document.getElementById('fx-css-src') ? document.getElementById('fx-css-src').textContent : '';

        function copyCleanHTML() {
            guardExport('html');
        }

        function doCopyHTML() {
            if (document.activeElement) document.activeElement.blur();
            saveNow();
            const html = buildCleanHTML();
            navigator.clipboard.writeText(html).then(() => showToast('✅ HTML 코드를 복사했어요. 원하는 곳에 붙여넣으세요!'))
                .catch(() => showToast('❌ 복사에 실패했어요. 다른 브라우저로 시도해 주세요.'));
        }

        // ==========================================
        // 🚀 시작
        // ==========================================
        // ==========================================
        // ❓ 도움말
        // ==========================================
        const HELP = [{
            art: '🗂️<small>꾸미기</small>',
            title: '1. 프리셋 고르기',
            body: `<li><b>🎨 꾸미기</b>에서 디자인(프리셋)을 골라요.</li>
                   <li>프리셋을 바꿔도 <b>적어 둔 내용은 그대로</b> 옮겨져요.</li>
                   <li>글꼴은 '프리셋 기본'이 디자인에 맞춘 원래 글꼴이에요. 다른 글꼴로 바꿔도 돼요.</li>`
        }, {
            art: '✏️<small>🧱 블럭별</small><small>📝 항목별</small>',
            title: '2. 내용 쓰기',
            body: `<li><b>✏️ 편집 → 🧱 블럭별</b>: 화면 순서대로 블럭이 나와요. 체크로 <b>켜고 끄고</b>, 줄을 누르면 입력칸이 열려요.</li>
                   <li><b>📝 항목별</b>: 호감도·속마음 같은 칸을 종류끼리 모아서 한 번에 써요.</li>
                   <li>오른쪽 <b>미리보기의 글자를 직접 눌러서</b> 고쳐도 돼요.</li>`
        }, {
            art: '<b style="font-size:30px">B</b><i style="font-size:30px;font-family:Georgia,serif">I</i><small>✨ 효과 ▾</small>',
            title: '3. 글자 꾸미기',
            body: `<li>미리보기에서 글자를 <b>드래그해서 고른 뒤</b> 위쪽 도구를 눌러요.</li>
                   <li><b>✨ 효과</b>를 누르면 글리치·네온·검열 같은 효과가 나와요.</li>
                   <li>이미 넣은 서식과 효과는 <b>✓</b>로 표시되고, 한 번 더 누르면 풀려요.</li>`
        }, {
            art: '💾<small>📷 PNG</small>',
            title: '4. 저장하기',
            body: `<li>쓰는 동안 <b>자동 저장</b>돼요. 슬롯 5개를 번갈아 쓸 수 있어요.</li>
                   <li><b>📷 PNG</b>는 접힌 칸까지 <b>전부 펼친 모습</b>으로 저장돼요. 빈칸이 있으면 저장 전에 어디인지 알려줘요.</li>
                   <li>되돌리기는 <b>↶ / Ctrl+Z</b>. 다른 기기로 옮길 땐 <b>💾 저장 → 파일로 백업</b>을 써요.</li>
                   <li>이 도움말은 왼쪽 <b>❓ 도움말</b>로 다시 볼 수 있어요.</li>`
        }];
        let helpIdx = 0;

        function openHelp(i) {
            helpIdx = Math.max(0, Math.min(HELP.length - 1, i || 0));
            const h = HELP[helpIdx];
            const last = helpIdx === HELP.length - 1;
            try {
                localStorage.setItem('makerHelpSeenV3', '1');
            } catch (e) {}
            openModal(`<button class="m-close" onclick="closeHelp()" title="닫기">✕</button>
                <div class="help-step"><div class="help-art">${h.art}</div><h2>${h.title}</h2><ul>${h.body}</ul></div>
                <div class="help-dots">${HELP.map((_, n) => `<i class="${n === helpIdx ? 'on' : ''}"></i>`).join('')}</div>
                <div class="m-actions">${helpIdx ? `<button onclick="openHelp(${helpIdx - 1})">← 이전</button>` : `<button onclick="closeHelp()">건너뛰기</button>`}
                <button class="primary" onclick="${last ? 'closeHelp()' : `openHelp(${helpIdx + 1})`}">${last ? '시작하기' : '다음 →'}</button></div>`);
        }

        function closeHelp() {
            closeModal();
            try {
                localStorage.setItem('makerHelpSeenV3', '1');
            } catch (e) {}
        }

        loadSlot();
        updateSlotButtons();
        applyZoom();
        let startTab = 'style';
        try {
            startTab = localStorage.getItem('makerTab') || 'style';
        } catch (e) {}
        switchTab(startTab, true);
        try {
            if (!localStorage.getItem('makerHelpSeenV3')) setTimeout(() => openHelp(0), 300);
        } catch (e) {}
    </script>
