<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🗂 캐릭터·프롬프트 보관함 · 로그 백업 스튜디오</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{color-scheme:light;--bg:#eef5fb;--panel:#fff;--ink:#25313c;--sub:#687989;--line:#dbe7f2;--accent:#5a9fd8;--accent-d:#3f80ba;--accent-soft:#e6f1fb;--ok:#2f7fb8}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:14px}
  textarea,select,input,button{color:var(--ink)}
  ::placeholder{color:#a1b0be}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  .nav{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
  .brand{font-weight:700;font-size:16px;padding:0 10px 4px;letter-spacing:-.3px}
  .brand-sub{font-size:12px;color:var(--sub);padding:0 10px 18px}
  .nav-label{font-size:11px;color:#97a7b6;padding:12px 10px 6px;letter-spacing:.06em}
  .nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
  .nav a:hover{background:#eff5fa}
  .nav a.on{background:var(--accent-soft);color:var(--accent-d);font-weight:700}
  .nav a .ic{width:22px;text-align:center}
  .nav .foot{margin-top:auto;font-size:12px;color:#97a7b6;padding:10px;line-height:1.6}
  .main{min-width:0}
  .view{display:none;padding:24px 28px 48px;max-width:1500px}
  .view.on{display:block}
  .view > header h1{margin:0 0 4px;font-size:21px;letter-spacing:-.4px}
  .view > header p{margin:0 0 20px;color:var(--sub);line-height:1.6}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .nav{position:sticky;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);z-index:20}
    .brand{padding:0 8px 0 2px;white-space:nowrap}
    .brand-sub,.nav-label,.nav .foot{display:none}
    .nav a{white-space:nowrap}
    .view{padding:16px 14px 40px}
  }

  /* home */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;text-decoration:none;color:var(--ink);display:block;transition:border-color .15s,transform .15s}
  .tile:hover{border-color:var(--accent);transform:translateY(-2px)}
  .tile .ic{font-size:26px}
  .tile h3{margin:10px 0 6px;font-size:16px}
  .tile p{margin:0;color:var(--sub);line-height:1.6;font-size:13px}
  .tile .use{margin-top:12px;font-size:12px;color:var(--accent-d);font-weight:500}
  .tile.soon{border-style:dashed;cursor:default;color:#97a7b6}
  .tile.soon:hover{border-color:var(--line);transform:none}

  /* ---------- shared components ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
  .step{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;align-items:center;justify-content:center;flex:none}
  textarea{width:100%;border:1px solid #d2e0ed;border-radius:8px;padding:10px 12px;font:inherit;line-height:1.6;resize:vertical;background:#fbfdff}
  textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  textarea.mono{font:12px/1.5 ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  select,input[type=text]{font:inherit;padding:5px 8px;border:1px solid #d2e0ed;border-radius:6px;background:#fff}
  button{font:inherit;cursor:pointer;border:1px solid #d2e0ed;background:#fff;border-radius:8px;padding:6px 12px}
  button:hover{background:#edf4fa}
  .btn{border:0;border-radius:8px;padding:9px 16px;font-weight:700}
  .btn.primary,button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover,button.primary:hover{background:var(--accent-d)}
  .btn.ghost{background:#eef0f3}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .hint{color:#8596a7;font-size:12px;line-height:1.6;margin:6px 0 0}
  .status{font-size:12px;color:var(--sub)}
  .status.ok{color:var(--ok)} .status.warn{color:#b45309}
  label{font-size:13px}
  .chk{display:flex;gap:6px;align-items:center}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2f2d;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  details summary{cursor:pointer;color:var(--accent-d);font-size:13px}

  /* ---------- tool: 보관함 ---------- */
  .t-vault .v-tabs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
  .t-vault .v-tabs .tab{padding:8px 16px;border-radius:999px;font-weight:600;color:var(--sub)}
  .t-vault .v-tabs .tab.on{background:linear-gradient(135deg,#6db3ea,#4c8fd0);border-color:#4f93d2;color:#fff}
  .t-vault .v-tabs .sp{flex:1}
  .t-vault .v-body{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:start}
  @media (max-width:820px){ .t-vault .v-body{grid-template-columns:1fr} }
  .t-vault .v-side{background:rgba(255,255,255,.9);border:1px solid #d9e7f3;border-radius:12px;padding:10px;position:sticky;top:12px}
  @media (max-width:820px){ .t-vault .v-side{position:static;display:flex;flex-wrap:wrap;gap:6px;padding:8px} .t-vault .v-side .cat{width:auto} .t-vault .v-side .cat.sub{padding-left:10px} .t-vault .v-side .side-h{display:none} }
  .t-vault .side-h{font-size:11px;color:var(--sub);letter-spacing:.08em;margin:4px 6px 6px}
  .t-vault .cat{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;text-align:left;padding:7px 9px;border-radius:8px;font-size:13px;color:var(--ink)}
  .t-vault .cat:hover{background:#eef5fb}
  .t-vault .cat.on{background:var(--accent-soft);color:var(--accent-d);font-weight:700}
  .t-vault .cat.sub{padding-left:24px;font-size:12.5px}
  .t-vault .cat .n{margin-left:auto;font-size:11px;color:#97a7b6;font-weight:400}
  .t-vault .cat .ed{display:none;font-size:11px;color:#97a7b6;padding:0 2px}
  .t-vault .cat:hover .ed{display:inline}
  .t-vault .cat.add{color:var(--accent-d);justify-content:center;border:1px dashed #c8dcee;margin-top:6px}
  .t-vault .v-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .t-vault .v-bar input[type=search]{flex:1 1 220px;min-width:0;padding:8px 12px;border:1px solid #d2e0ed;border-radius:10px;background:#fff;font:inherit}
  .t-vault .v-bar select{padding:7px 8px;border:1px solid #d2e0ed;border-radius:9px;background:#fff;font:inherit;font-size:12.5px}
  .t-vault .v-tagbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .t-vault .chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;border:1px solid #d2e0ed;background:#fff;font-size:12px;color:#4d6a85}
  .t-vault button.chip{cursor:pointer}
  .t-vault .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .t-vault .v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  @media (max-width:600px){ .t-vault .v-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} .t-vault .pc .im{font-size:32px} }
  .t-vault .v-grid.prompts{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  @media (max-width:600px){ .t-vault .v-grid.prompts{grid-template-columns:1fr} }
  .t-vault .pc{position:relative;background:rgba(255,255,255,.92);border:1px solid #d9e7f3;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;box-shadow:0 4px 18px rgba(90,159,216,.07)}
  .t-vault .pc:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(90,159,216,.16)}
  .t-vault .pc .im{aspect-ratio:3/4;background:linear-gradient(160deg,#cfe6fb,#eef7ff);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:#7fb2df;overflow:hidden}
  .t-vault .pc .im img{width:100%;height:100%;object-fit:cover;display:block}
  .t-vault .pc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
  .t-vault .pc .nm{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t-vault .pc .in{font-size:12px;color:var(--sub);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .t-vault .pc .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
  .t-vault .pc .tg span{font-size:10.5px;color:#4f7ea8;background:#eaf3fc;border-radius:999px;padding:1px 7px}
  .t-vault .pc .pin{position:absolute;top:8px;left:8px;font-size:13px;background:rgba(255,255,255,.9);border-radius:999px;padding:1px 6px}
  .t-vault .qc .top{display:flex;gap:10px;padding:12px 12px 0}
  .t-vault .qc .th{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#eaf3fc}
  .t-vault .qc .th img{width:100%;height:100%;object-fit:cover;display:block}
  .t-vault .qc .pv{margin:8px 12px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.55;color:#3d566e;background:#f3f8fc;border-radius:8px;padding:8px 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
  .t-vault .qc .pv.neg{color:#9a4b4b;background:#fbf3f3;display:block;white-space:nowrap;text-overflow:ellipsis}
  .t-vault .qc .acts{display:flex;gap:6px;padding:10px 12px 12px;margin-top:auto}
  .t-vault .qc .acts button{flex:1;padding:6px 8px;font-size:12px}
  .t-vault .v-empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:50px 10px;line-height:1.8;border:1px dashed #c8dcee;border-radius:14px;background:rgba(255,255,255,.6)}
  /* 모달 */
  .v-modal{position:fixed;inset:0;z-index:100;background:rgba(30,60,90,.35);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto}
  .v-modal.on{display:flex}
  .v-dialog{width:100%;max-width:760px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(30,60,90,.25);overflow:hidden}
  .v-dialog.sm{max-width:420px}
  .v-dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #e3edf6;background:linear-gradient(160deg,#e6f2fd,#f7fbff)}
  .v-dh b{font-size:15px}
  .v-dh .x{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;color:#7f97ad;padding:2px 6px}
  .v-db{padding:18px}
  .v-df{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid #e3edf6;background:#fafcfe}
  .v-df .sp{flex:1}
  .v-df .danger{color:#c2410c;border-color:#f3c9b5}
  .v-form{display:grid;grid-template-columns:150px 1fr;gap:16px}
  @media (max-width:600px){ .v-form{grid-template-columns:1fr} }
  .v-drop{aspect-ratio:3/4;border:1.5px dashed #b9d4ec;border-radius:12px;background:#f3f8fd;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:#6f8ea9;cursor:pointer;overflow:hidden;position:relative}
  .v-drop.sq{aspect-ratio:1/1}
  .v-drop img{width:100%;height:100%;object-fit:cover;display:block}
  .v-drop .rm{position:absolute;top:6px;right:6px;border-radius:999px;padding:1px 8px;font-size:11px}
  @media (max-width:600px){ .v-drop{max-width:170px} }
  .v-fields{display:flex;flex-direction:column;gap:10px;min-width:0}
  .v-fields label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
  .v-fields input[type=text],.v-fields select,.v-fields textarea{width:100%;padding:7px 10px;border:1px solid #d2e0ed;border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
  .v-fields textarea{min-height:90px;resize:vertical;line-height:1.6}
  .v-fields textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .v-row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .v-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .v-sec{border:1px solid #e3edf6;border-radius:12px;padding:12px;background:#fbfdff}
  .v-sec h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:8px}
  .v-sec h4 .sp{flex:1}
  .v-outfit{border:1px solid #e3edf6;border-radius:10px;padding:10px;margin-bottom:8px;background:#fff;display:flex;flex-direction:column;gap:6px}
  .v-taginput{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border:1px solid #d2e0ed;border-radius:9px;padding:5px 7px;background:#fff}
  .v-taginput input{border:0!important;padding:3px 4px!important;flex:1;min-width:90px;outline:none}
  .v-taginput .chip{padding:2px 8px}
  .v-taginput .chip b{cursor:pointer;color:#97a7b6;font-weight:400}
  /* 상세 보기 */
  .v-view{display:grid;grid-template-columns:200px 1fr;gap:18px}
  @media (max-width:600px){ .v-view{grid-template-columns:1fr} }
  .v-view .pic{border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#cfe6fb,#eef7ff);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700;color:#7fb2df}
  @media (max-width:600px){ .v-view .pic{max-width:220px} }
  .v-view .pic img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .v-view h3{margin:0;font-size:22px}
  .v-view .intro{color:var(--sub);margin:4px 0 10px}
  .v-view .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .v-view .blk{margin-top:14px}
  .v-view .blk h5{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:13px;color:var(--accent-d)}
  .v-view .blk h5 .sp{flex:1}
  .v-view .blk h5 button{padding:3px 10px;font-size:11.5px}
  .v-view .txt{white-space:pre-wrap;line-height:1.75;font-size:13.5px;background:#f7fafd;border:1px solid #e3edf6;border-radius:10px;padding:10px 12px;word-break:break-word}
  .v-view .txt.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;word-break:break-all}
  .v-view .txt.neg{background:#fdf6f6;border-color:#f1e0e0}
  .v-zoom{position:fixed;inset:0;z-index:120;background:rgba(10,20,30,.8);display:none;align-items:center;justify-content:center;cursor:zoom-out}
  .v-zoom.on{display:flex}
  .v-zoom img{max-width:94vw;max-height:94vh;border-radius:8px}
  .toast{z-index:200}
  /* 페르소나 상세 (새 레이아웃) */
  .v-dialog.mid{max-width:600px}
  .pv-tabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 14px;background:#f5f9fd;border-bottom:1px solid #e3edf6}
  .pv-tabs .pt{border:0;background:transparent;padding:7px 14px;border-radius:10px;font-weight:700;font-size:13.5px;color:#7f93a6}
  .pv-tabs .pt:hover{background:#e9f2fb}
  .pv-tabs .pt.on{background:linear-gradient(135deg,#6db3ea,#4c8fd0);color:#fff;box-shadow:0 3px 10px rgba(76,143,208,.25)}
  .pv-tabs .pt.add{border:1.5px dashed #c8dcee;color:#8aa1b6;font-weight:600}
  .pv-tabs .sp{flex:1}
  .pv-tabs .x{border:0;background:transparent;font-size:20px;line-height:1;color:#7f97ad;padding:2px 6px}
  .pview{padding:18px 20px 8px}
  .pview .hero{border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#cfe6fb,#eef7ff);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
  .pview .hero img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .pview .hero.noimg{aspect-ratio:auto;height:120px}
  .pview .hero span{font-size:48px;font-weight:800;color:#7fb2df}
  .pview .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .pview .pill{font-size:12.5px;padding:3px 12px;border-radius:999px;background:#e6f0fb;color:#3f6f9e}
  .pview .pill.au{background:#fde9f2;color:#b04a7c}
  .pview .nmrow{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin-top:10px}
  .pview .nmrow h3{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
  .pview .nmrow .w{font-weight:800;color:#4c8fd0;font-size:15px}
  .pview .nmrow .wn{color:#7f8c99;font-size:15.5px}
  .pview .intro{color:#7f8c99;font-size:15px;margin-top:2px}
  .pview .stats{display:grid;gap:10px;margin-top:16px}
  .pview .stats div{background:#f4f8fc;border-radius:14px;padding:11px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
  .pview .stats span{font-size:12.5px;color:#7f8c99}
  .pview .stats b{font-size:18px;color:#1f2a35}
  .pview .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .pview .tags span{font-size:12px;color:#4f7ea8;background:#eaf3fc;border-radius:999px;padding:2px 9px}
  .pview .sec{margin-top:18px}
  .pview .sh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .pview .sh b{font-size:14px;color:#6b7a88}
  .pview .sh .cp{margin-left:auto;padding:4px 12px;font-size:12.5px;color:#6b7a88;border-color:#dbe4ee;border-radius:9px}
  .pview .box{background:#f4f8fc;border-radius:14px;padding:13px 15px;white-space:pre-wrap;line-height:1.75;font-size:14px;word-break:break-word}
  .pview .box.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;word-break:break-all}
  .pview .box.neg{background:#fdf5f5;color:#8a4646}
  .pview .box.sm{padding:8px 11px;margin-top:6px}
  .pview .cnt{text-align:right;font-size:12px;color:#97a3ae;margin-top:5px}
  .pview .outfit{border:1px solid #e3edf6;border-radius:14px;padding:11px 13px;margin-bottom:8px}
  .pview .outfit .oh{display:flex;align-items:center;gap:8px}
  .pview .outfit .oh .cp{margin-left:auto;padding:3px 10px;font-size:12px;color:#6b7a88;border-color:#dbe4ee;border-radius:9px}
  .pview .outfit .od{font-size:13px;color:#7f8c99;margin-top:3px;white-space:pre-wrap}
  .t-vault .pc .aub{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;background:rgba(253,233,242,.95);color:#b04a7c;border-radius:999px;padding:1px 8px;z-index:1}
  .v-note{font-size:12.5px;line-height:1.6;background:#fff8e6;border:1px solid #f1e2b8;color:#7a5c12;border-radius:10px;padding:8px 11px}
  /* 상세: 왼쪽 프로필 사진 · 오른쪽 정보 스크롤 */
  .v-dialog.wide{max-width:920px}
  .pview2{display:grid;grid-template-columns:minmax(240px,340px) 1fr;grid-template-rows:minmax(0,1fr);height:min(74vh,720px)}
  .pview2>*{min-height:0}
  .pview2 .pl{padding:20px 0 20px 20px;display:flex;flex-direction:column}
  .pview2 .hero{aspect-ratio:3/4;width:100%;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#cfe6fb,#eef7ff);display:flex;align-items:center;justify-content:center;flex:none}
  .pview2 .hero img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .pview2 .hero span{font-size:56px;font-weight:800;color:#7fb2df}

<div class="toast" id="toast"></div>
<script>
(function(){
const $=id=>document.getElementById('v-'+id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n).toLocaleString('ko-KR');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m){ const t=document.getElementById('toast'); if(!t) return; t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2000); }

/* ---------- 큰 저장소 (IndexedDB) ---------- */
const DBNAME='studio-vault';
let db=null;
function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DBNAME,1);
  r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if(!d.objectStoreNames.contains('img')) d.createObjectStore('img'); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=db.transaction(store,mode); const s=t.objectStore(store); let out; const r=fn(s); if(r) r.onsuccess=()=>{ out=r.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const kvGet=k=>tx('kv','readonly',s=>s.get(k));
const kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
const imgGet=id=>tx('img','readonly',s=>s.get(id));
const imgSet=(id,v)=>tx('img','readwrite',s=>s.put(v,id));
const imgDel=id=>tx('img','readwrite',s=>s.delete(id));
const imgAll=()=>new Promise((res,rej)=>{ const out={}; const t=db.transaction('img','readonly'); const c=t.objectStore('img').openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); });
const imgClear=()=>tx('img','readwrite',s=>s.clear());

const BLANK=()=>({v:1, personas:[], prompts:[], pairs:[], pcats:[], qcats:[], rcats:[]});
let D=BLANK();
const IMG=new Map();
async function img(id){ if(!id) return null; if(IMG.has(id)) return IMG.get(id); const v=await imgGet(id).catch(()=>null); IMG.set(id,v||null); return v||null; }

let U={tab:'persona', cat:{persona:'all',prompt:'all',pair:'all'}, q:'', tag:null, sort:'upd'};
try{ Object.assign(U, JSON.parse(localStorage.getItem('vault-ui')||'{}')); }catch(e){}
if(!U.cat||typeof U.cat!=='object') U.cat={persona:'all',prompt:'all',pair:'all'};
if(!['persona','prompt','pair'].includes(U.tab)) U.tab='persona';
const saveUI=()=>{ try{ localStorage.setItem('vault-ui',JSON.stringify({tab:U.tab,cat:U.cat,sort:U.sort})); }catch(e){} };

async function save(){
  try{ await kvSet('data',D); }catch(e){ toast('저장하지 못했어요: '+(e&&e.name||'오류')); return; }
  try{ localStorage.setItem('vault-summary',JSON.stringify({p:D.personas.length,q:D.prompts.length,r:(D.pairs||[]).length})); localStorage.setItem('studioTouch:vault',String(Date.now())); }catch(e){}
}

/* ---------- 원본 메타데이터 (PNG 텍스트 정보) ---------- */
const ORIG=id=>id+':o';
async function inflate(u8){ try{ if(!window.DecompressionStream) return null; const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate')); return new Uint8Array(await new Response(st).arrayBuffer()); }catch(e){ return null; } }
const latin1=u=>{ let r=''; for(const b of u) r+=String.fromCharCode(b); return r; };
const utf8=u=>new TextDecoder().decode(u);
async function readMeta(file){
  try{
    const u8=new Uint8Array(await file.arrayBuffer());
    if(!(u8[0]===0x89&&u8[1]===0x50&&u8[2]===0x4E&&u8[3]===0x47)) return null;
    const dv=new DataView(u8.buffer); const texts=[]; let i=8;
    while(i+8<=u8.length){
      const len=dv.getUint32(i), type=latin1(u8.subarray(i+4,i+8)), d=u8.subarray(i+8,i+8+len);
      if(i+8+len>u8.length) break;
      if(type==='tEXt'){ const z=d.indexOf(0); texts.push([latin1(d.subarray(0,z)), utf8(d.subarray(z+1))]); }
      else if(type==='zTXt'){ const z=d.indexOf(0); const t=await inflate(d.subarray(z+2)); if(t) texts.push([latin1(d.subarray(0,z)), utf8(t)]); }
      else if(type==='iTXt'){ const z=d.indexOf(0); const comp=d[z+1]; let q=z+3; q=d.indexOf(0,q)+1; q=d.indexOf(0,q)+1; const body=d.subarray(q); const t=comp?await inflate(body):body; if(t) texts.push([latin1(d.subarray(0,z)), utf8(t)]); }
      if(type==='IEND') break; i+=12+len;
    }
    const get=k=>(texts.find(t=>t[0].toLowerCase()===k)||[])[1];
    let pos='', neg='', src='';
    const cm=get('comment');
    if(cm){ try{ const j=JSON.parse(cm); pos=j.prompt||(j.v4_prompt&&j.v4_prompt.caption&&j.v4_prompt.caption.base_caption)||''; neg=j.uc||(j.v4_negative_prompt&&j.v4_negative_prompt.caption&&j.v4_negative_prompt.caption.base_caption)||''; src='NovelAI'; }catch(e){} }
    if(!pos && get('description')){ pos=get('description'); src='NovelAI'; }
    const pr=get('parameters');
    if(!pos && pr){ const m=pr.split(/\nNegative prompt:\s*/); pos=m[0].trim(); neg=(m[1]||'').split(/\nSteps:/)[0].trim(); src='Stable Diffusion'; }
    return {has:texts.length>0, pos, neg, src};
  }catch(e){ return null; }
}
function dataToBlob(d){ const m=/^data:([^;,]+)?(;base64)?,(.*)$/s.exec(d); if(!m) return null; const raw=m[2]?atob(m[3]):decodeURIComponent(m[3]); const u=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) u[i]=raw.charCodeAt(i); return new Blob([u],{type:m[1]||'application/octet-stream'}); }
function downloadData(d,name){ const b=dataToBlob(d); if(!b) return; const url=URL.createObjectURL(b); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }
function lightbox(src){
  let lb=document.getElementById('v-lb');
  if(!lb){ lb=document.createElement('div'); lb.id='v-lb'; lb.className='v-lb'; document.body.appendChild(lb); lb.onclick=()=>lb.classList.remove('on'); document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&lb.classList.contains('on')){ e.stopImmediatePropagation(); lb.classList.remove('on'); } },true); }
  lb.innerHTML=`<img src="${src}" alt=""><span>아무 곳이나 누르면 닫혀요</span>`; lb.classList.add('on');
}

/* ---------- 이미지 줄이기 ---------- */
function readFile(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
async function shrink(file, max=1100){
  const src=await readFile(file);
  if(/image\/gif/.test(file.type)) return src;
  const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
  const k=Math.min(1, max/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.round(im.naturalWidth*k), h=Math.round(im.naturalHeight*k);
  const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h);
  let out=c.toDataURL('image/webp',0.86);
  if(!/^data:image\/webp/.test(out)) out=c.toDataURL('image/jpeg',0.88);
  return out.length<src.length?out:src;
}

/* ---------- 복사 ---------- */
async function copy(t,label){
  if(!t){ toast('복사할 내용이 없어요'); return; }
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); }
  toast((label||'')+' 복사했어요');
}

/* ---------- 목록 ---------- */
const TABS={persona:{list:'personas',cats:'pcats',ord:'porder'}, prompt:{list:'prompts',cats:'qcats',ord:'qorder'}, pair:{list:'pairs',cats:'rcats',ord:'rorder'}};
const items=()=>D[TABS[U.tab].list]||(D[TABS[U.tab].list]=[]);
const cats=()=>D[TABS[U.tab].cats]||(D[TABS[U.tab].cats]=[]);
const kids=id=>cats().filter(c=>c.parent===id).map(c=>c.id);
function inCat(it,c){
  if(c==='all') return !it.hideAll;
  if(c==='none') return !it.cat || !cats().some(x=>x.id===it.cat);
  return it.cat===c || kids(c).includes(it.cat);
}
function hay(it){
  if(U.tab==='persona') return [it.name,it.intro,it.age,it.height,it.gender,it.with,it.au,it.setting,it.memo,it.pos,(it.tags||[]).join(' '),(it.outfits||[]).map(o=>o.name+' '+o.desc).join(' '),(it.aus||[]).map(a=>[a.label,a.name,a.intro,a.setting,a.with].join(' ')).join(' ')].join(' ').toLowerCase();
  if(U.tab==='pair') return [it.name,pairName(it.a),pairName(it.b),it.dday,it.rel,it.callAB,it.callBA,it.story,it.pos,it.memo,(it.tags||[]).join(' ')].join(' ').toLowerCase();
  return [it.title,it.pos,it.neg,it.memo,it.src,(it.tags||[]).join(' ')].join(' ').toLowerCase();
}
function filtered(){
  const c=U.cat[U.tab]||'all';
  let arr=items().filter(it=>inCat(it,c));
  const base=arr;
  const ws=U.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(ws.length) arr=arr.filter(it=>{ const h=hay(it); return ws.every(w=>h.includes(w)); });
  if(U.tag) arr=arr.filter(it=>(it.tags||[]).includes(U.tag));
  const nm=it=>(U.tab==='prompt'?it.title:it.name)||'';
  if(U.sort==='custom'){ const ord=orderList(); const pos=new Map(ord.map((id,i)=>[id,i])); arr=[...arr].sort((a,b)=>(pos.get(a.id)??-1)-(pos.get(b.id)??-1)); }
  else arr=[...arr].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0) || (U.sort==='name'?nm(a).localeCompare(nm(b),'ko'):U.sort==='new'?(b.created||0)-(a.created||0):(b.updated||0)-(a.updated||0)));
  return {arr, base};
}
/* 내 순서: 저장된 순서 + 새로 생긴 항목은 맨 앞 */
const ordKey=()=>TABS[U.tab].ord;
function orderList(){
  const ids=items().map(x=>x.id), have=new Set(ids);
  let o=(D[ordKey()]||[]).filter(id=>have.has(id)); const inO=new Set(o);
  const fresh=items().filter(x=>!inO.has(x.id)).sort((a,b)=>(b.created||0)-(a.created||0)).map(x=>x.id);
  return [...fresh,...o];
}
function renderSide(){
  const cs=cats(), cur=U.cat[U.tab]||'all';
  const cnt=c=>items().filter(it=>inCat(it,c)).length;
  let h=`<div class="side-h">카테고리</div><button class="cat ${cur==='all'?'on':''}" data-c="all">전체<span class="n">${cnt('all')}</span></button>`;
  cs.filter(c=>!c.parent || !cs.some(x=>x.id===c.parent)).forEach(r=>{
    h+=`<button class="cat ${cur===r.id?'on':''}" data-c="${r.id}">📁 ${esc(r.name)}<span class="n">${cnt(r.id)}</span><span class="ed" data-e="${r.id}">✎</span></button>`;
    cs.filter(c=>c.parent===r.id).forEach(k=>{ h+=`<button class="cat sub ${cur===k.id?'on':''}" data-c="${k.id}">└ ${esc(k.name)}<span class="n">${cnt(k.id)}</span><span class="ed" data-e="${k.id}">✎</span></button>`; });
  });
  const none=cnt('none'); if(cs.length && none) h+=`<button class="cat ${cur==='none'?'on':''}" data-c="none">미분류<span class="n">${none}</span></button>`;
  h+=`<button class="cat add" data-add="1">＋ 카테고리</button>`;
  $('side').innerHTML=h;
  $('side').querySelectorAll('.cat').forEach(b=>b.onclick=e=>{
    const ed=e.target.closest('[data-e]'); if(ed){ e.stopPropagation(); catModal(cs.find(c=>c.id===ed.dataset.e)); return; }
    if(b.dataset.add){ catModal(null); return; }
    U.cat[U.tab]=b.dataset.c; U.tag=null; saveUI(); render();
  });
}
function renderTags(base){
  const m=new Map(); base.forEach(it=>(it.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));
  const tags=[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,30);
  if(U.tag && !m.has(U.tag)) U.tag=null;
  $('tagbar').innerHTML=tags.length?tags.map(([t,n])=>`<button class="chip ${U.tag===t?'on':''}" data-t="${esc(t)}">#${esc(t)} <span style="opacity:.6">${n}</span></button>`).join(''):'';
  $('tagbar').querySelectorAll('button').forEach(b=>b.onclick=()=>{ U.tag=U.tag===b.dataset.t?null:b.dataset.t; render(); });
}
function initial(n){ return esc(([...String(n||'?').trim()][0]||'?')); }
function render(){
  document.querySelectorAll('.t-vault .v-tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===U.tab));
  document.querySelectorAll('#v-vside [data-vtab]').forEach(a=>{ const t=a.dataset.vtab, n=(D[TABS[t].list]||[]).length; a.classList.toggle('on',t===U.tab); a.querySelector('.n').textContent=n||''; });
  const H={persona:['캐릭터','AI 채팅 페르소나를 사진, AU, 의상과 함께 모아두는 곳이에요.'],pair:['페어','두 캐릭터의 관계, 호칭, 서사를 정리해두는 곳이에요.'],prompt:['프롬프트','노벨AI 프롬프트를 결과 이미지(원본)와 함께 모아두는 곳이에요.']}[U.tab];
  const hh=document.querySelector('.t-vault > header'); if(hh){ hh.querySelector('h1').textContent=H[0]; hh.querySelector('p').textContent=H[1]; }
  $('new').textContent={persona:'＋ 새 페르소나',prompt:'＋ 새 프롬프트',pair:'＋ 새 페어'}[U.tab];
  $('q').placeholder={persona:'이름, 태그, 설정, 의상으로 찾기',prompt:'제목, 태그, 프롬프트 내용으로 찾기',pair:'페어 이름, 캐릭터, 관계, 서사로 찾기'}[U.tab];
  $('sort').value=U.sort;
  renderSide();
  const {arr,base}=filtered(); renderTags(base);
  const g=$('grid'); g.classList.toggle('prompts',U.tab==='prompt'); g.classList.toggle('pairs',U.tab==='pair');
  if(!arr.length){
    g.innerHTML=`<div class="v-empty">${items().length?'조건에 맞는 항목이 없어요.':(U.tab==='pair'?'아직 정리한 페어가 없어요.<br><b>＋ 새 페어</b>로 두 캐릭터를 묶어 보세요.':U.tab==='persona'?'아직 저장한 페르소나가 없어요.<br><b>＋ 새 페르소나</b>로 첫 캐릭터를 넣어 보세요.':'아직 저장한 프롬프트가 없어요.<br><b>＋ 새 프롬프트</b>로 자주 쓰는 프롬프트를 모아 보세요.')}</div>`;
    return;
  }
  if(U.tab==='persona'){
    g.innerHTML=arr.map(p=>`<div class="pc" data-id="${p.id}">${p.pin?'<span class="pin">📌</span>':''}${(p.aus||[]).length?`<span class="aub">AU ${p.aus.length}</span>`:''}<div class="im" data-img="${p.img||''}">${initial(p.name)}</div><div class="bd"><div class="nm">${esc(p.name)}</div>${p.intro?`<div class="in">${esc(p.intro)}</div>`:''}${(p.tags||[]).length?`<div class="tg">${p.tags.slice(0,4).map(t=>`<span>#${esc(t)}</span>`).join('')}</div>`:''}</div></div>`).join('');
  } else if(U.tab==='pair'){
    g.innerHTML=arr.map(r=>{ const A=pairSide(r.a), B=pairSide(r.b), dd=ddayText(r.dday);
      const ia=r.imgA||A.img, ib=r.imgB||B.img;
      const cov=r.mode==='two'?`<div class="half"><span data-img="${ia||''}" class="hf">${initial(A.name)}</span><span data-img="${ib||''}" class="hf">${initial(B.name)}</span></div>`
        :r.img?`<div class="cover" data-img="${r.img}"></div>`:`<div class="duo"><span class="av" data-img="${A.img||''}">${initial(A.name)}</span><span class="x">×</span><span class="av" data-img="${B.img||''}">${initial(B.name)}</span></div>`;
      return `<div class="pc rc" data-id="${r.id}">${r.pin?'<span class="pin">📌</span>':''}<div class="rcov">${cov}${dd?`<span class="ddb">${dd}</span>`:''}</div><div class="bd"><div class="nm">${esc(r.name||(A.name+' × '+B.name))}</div><div class="who">${esc(A.name||'?')} <i>×</i> ${esc(B.name||'?')}</div>${r.rel?`<div class="in">${esc(r.rel)}</div>`:''}${(r.tags||[]).length?`<div class="tg">${r.tags.slice(0,4).map(t=>`<span>#${esc(t)}</span>`).join('')}</div>`:''}</div></div>`; }).join('');
  } else {
    g.innerHTML=arr.map(q=>`<div class="pc qc" data-id="${q.id}">${q.pin?'<span class="pin">📌</span>':''}${q.img?`<div class="cover" data-img="${q.img}">${q.orig?'<span class="ob" title="원본(메타데이터 포함) 보관 중">원본</span>':''}</div>`:''}<div class="top"><div style="min-width:0;flex:1"><div class="nm" style="font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.title)}</div>${(q.tags||[]).length?`<div class="tg" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">${q.tags.slice(0,4).map(t=>`<span style="font-size:10.5px;color:#4f7ea8;background:#eaf3fc;border-radius:999px;padding:1px 7px">#${esc(t)}</span>`).join('')}</div>`:''}${q.memo?`<div style="font-size:12px;color:var(--sub);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.memo)}</div>`:''}</div></div>${q.pos?`<div class="pv">${esc(q.pos)}</div>`:''}${q.neg?`<div class="pv neg">${esc(q.neg)}</div>`:''}<div class="acts"><button data-cp="pos" ${q.pos?'':'disabled'}>긍정 복사</button><button data-cp="neg" ${q.neg?'':'disabled'}>부정 복사</button></div></div>`).join('');
  }
  g.querySelectorAll('.pc').forEach(el=>el.onclick=e=>{
    const it=items().find(x=>x.id===el.dataset.id); if(!it) return;
    const cp=e.target.closest('[data-cp]'); if(cp){ e.stopPropagation(); copy(it[cp.dataset.cp], cp.dataset.cp==='pos'?'긍정 프롬프트를':'부정 프롬프트를'); return; }
    U.tab==='persona'?viewPersona(it):U.tab==='pair'?editPair(it):editPrompt(it);
  });
  enableDrag(g);
  $('dragHint').style.display=arr.length>1?'':'none';

/* ---------- 끌어서 순서 바꾸기 (마우스: 끌기 / 터치: 꾹 누른 뒤 끌기) ---------- */
let drag=null, justDragged=0;
function enableDrag(g){
  g.querySelectorAll('.pc').forEach(el=>{
    el.querySelectorAll('img').forEach(i=>i.draggable=false);
    el.addEventListener('contextmenu',e=>{ if(drag||el._hold) e.preventDefault(); });
    el.addEventListener('pointerdown',e=>{
      if(e.button>0 || e.target.closest('button')) return;
      const st={el, x:e.clientX, y:e.clientY, id:e.pointerId, touch:e.pointerType!=='mouse', on:false};
      el._hold=true;
      st.timer=st.touch?setTimeout(()=>{ start(st,e.clientX,e.clientY); if(navigator.vibrate) try{ navigator.vibrate(15); }catch(_){} },380):null;
      const mv=ev=>{ if(ev.pointerId!==st.id) return;
        const dx=ev.clientX-st.x, dy=ev.clientY-st.y, far=Math.hypot(dx,dy);
        if(!st.on){ if(st.touch){ if(far>9){ clearTimeout(st.timer); cleanup(); } return; } if(far>6) start(st,ev.clientX,ev.clientY); else return; }
        move(ev.clientX,ev.clientY); };
      const up=ev=>{ if(ev.pointerId!==st.id) return; clearTimeout(st.timer); if(st.on) finish(); cleanup(); };
      const cleanup=()=>{ el._hold=false; window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); };
      window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
    });
  });
}
function start(st,x,y){
  st.on=true; const r=st.el.getBoundingClientRect();
  const gh=st.el.cloneNode(true); gh.className=st.el.className+' ghost';
  Object.assign(gh.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',pointerEvents:'none',zIndex:90,margin:0});
  (document.querySelector('.t-vault')||document.body).appendChild(gh); st.el.classList.add('dragging');
  drag={...st, gh, ox:x-r.left, oy:y-r.top, g:st.el.parentElement};
  document.body.classList.add('v-dragging');
}
function move(x,y){
  if(!drag) return;
  drag.gh.style.left=(x-drag.ox)+'px'; drag.gh.style.top=(y-drag.oy)+'px';
  if(y<70) window.scrollBy(0,-12); else if(y>innerHeight-70) window.scrollBy(0,12);
  const t=document.elementFromPoint(x,y); const over=t&&t.closest&&t.closest('.v-grid .pc:not(.ghost)');
  if(!over||over===drag.el) return;
  const r=over.getBoundingClientRect(), list=[...drag.g.children];
  const before = (Math.abs(r.top-drag.el.getBoundingClientRect().top)<r.height/2) ? x<r.left+r.width/2 : list.indexOf(drag.el)>list.indexOf(over);
  drag.g.insertBefore(drag.el, before?over:over.nextSibling);
}
async function finish(){
  const d=drag; drag=null; justDragged=Date.now();
  d.gh.remove(); d.el.classList.remove('dragging'); document.body.classList.remove('v-dragging');
  const vis=[...d.g.querySelectorAll('.pc')].map(x=>x.dataset.id);
  const base=U.sort==='custom'?orderList():filteredAllIds();
  const visSet=new Set(vis); let k=0;
  D[ordKey()]=base.map(id=>visSet.has(id)?vis[k++]:id);
  const was=U.sort; U.sort='custom'; saveUI(); await save(); render();
  if(was!=='custom') toast('정렬을 \'내 순서\'로 바꿨어요');
}
/* 지금 보이는 정렬 기준으로 전체 순서 만들기 (처음 끌 때) */
function filteredAllIds(){
  const keep=U.cat[U.tab], q=U.q, tg=U.tag; U.cat[U.tab]='all'; U.q=''; U.tag=null;
  const all=items().map(x=>x.id); const shown=filtered().arr.map(x=>x.id);

function tagInput(box,tags){
  const all=[...new Set(items().flatMap(i=>i.tags||[]))];
  const listId='v-tl-'+Math.random().toString(36).slice(2,6);
  const paint=()=>{ box.innerHTML=tags.map((t,i)=>`<span class="chip">#${esc(t)} <b data-i="${i}">×</b></span>`).join('')+`<input type="text" list="${listId}" placeholder="${tags.length?'':'태그 입력 후 Enter'}"><datalist id="${listId}">${all.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>`;
    const inp=box.querySelector('input');
    box.querySelectorAll('b[data-i]').forEach(b=>b.onclick=()=>{ tags.splice(+b.dataset.i,1); paint(); box.querySelector('input').focus(); });
    inp.onkeydown=e=>{ if((e.key==='Enter'||e.key===',') && !e.isComposing){ e.preventDefault(); add(inp.value); } else if(e.key==='Backspace' && !inp.value && tags.length){ tags.pop(); paint(); box.querySelector('input').focus(); } };
    inp.onchange=()=>{ if(all.includes(inp.value.trim())) add(inp.value); };
  };
  const add=v=>{ v.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean).forEach(s=>{ if(!tags.includes(s)) tags.push(s); }); paint(); box.querySelector('input').focus(); };
  box.onclick=e=>{ if(e.target===box) box.querySelector('input').focus(); };
  paint();
  return ()=>{ const v=box.querySelector('input').value; if(v.trim()) v.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean).forEach(s=>{ if(!tags.includes(s)) tags.push(s); }); return tags; };
}

function imgPicker(drop, cur, sq, o={}){
  const st={data:cur, changed:false, orig:null, origName:'', keepOld:!!o.hasOrig};
  const file=document.createElement('input'); file.type='file'; file.accept='image/*'; file.style.display='none'; drop.after(file);

    const rm=drop.querySelector('.rm'); if(rm) rm.onclick=e=>{ e.stopPropagation(); st.data=null; st.orig=null; st.keepOld=false; st.changed=true; paint(); o.onChange&&o.onChange(st); };
    const ch=drop.querySelector('.ch'); if(ch) ch.onclick=e=>{ e.stopPropagation(); file.click(); };
    const zm=drop.querySelector('.zm'); if(zm) zm.onclick=async e=>{ e.stopPropagation(); lightbox(st.orig||(st.keepOld&&o.getOrig&&await o.getOrig())||st.data); }; };
  const take=async(f,pasted)=>{ if(!f||!/^image\//.test(f.type)) return; try{
      st.data=await shrink(f); st.changed=true; st.keepOld=false; st.orig=null;
      if(sq){ st.orig=await readFile(f); st.origName=f.name||''; st.meta=pasted?null:await readMeta(f); st.pasted=!!pasted; }
      paint(); o.onChange&&o.onChange(st);
    }catch(e){ toast('이미지를 읽지 못했어요'); } };
  drop.onclick=()=>{ if(st.data&&sq){ drop.querySelector('.zm').click(); return; } file.click(); }; file.onchange=()=>{ take(file.files[0]); file.value=''; };
  drop.ondragover=e=>{ e.preventDefault(); drop.style.borderColor='#5a9fd8'; };
  drop.ondragleave=()=>{ drop.style.borderColor=''; };
  drop.ondrop=e=>{ e.preventDefault(); drop.style.borderColor=''; take(e.dataTransfer.files[0]); };
  onPaste=f=>take(f,true); paint();
  return st;
}

  const getTags=tagInput($('f-tags'),r.tags||[]);
  $('cpPos').onclick=()=>copy($('f-pos').value.trim(),'페어 프롬프트를');
  const formState=()=>JSON.stringify([$('f-name').value,side('a'),side('b'),$('f-dday').value,$('f-rel').value,$('f-callAB').value,$('f-callBA').value,$('f-cat').value,$('f-story').value,$('f-pos').value,$('f-memo').value,$('f-pin').checked,getTags()]);
  const mode0=r.mode, snap0=formState(); dirtyFn=()=>stOne.changed||(st.a&&st.a.changed)||(st.b&&st.b.changed)||r.mode!==mode0||formState()!==snap0;
  $('save').onclick=async()=>{
    Object.assign(r,{name:$('f-name').value.trim(), a:side('a'), b:side('b'), dday:$('f-dday').value, rel:$('f-rel').value.trim(), callAB:$('f-callAB').value.trim(), callBA:$('f-callBA').value.trim(), cat:$('f-cat').value||null, tags:getTags(), story:$('f-story').value.trim(), pos:$('f-pos').value.trim(), memo:$('f-memo').value.trim(), pin:$('f-pin').checked, updated:Date.now()});
    if(!r.name && !r.a.name && !r.b.name){ toast('제목이나 캐릭터를 적어 주세요'); $('f-name').focus(); return; }
    if(isNew) r.created=Date.now();
    try{
      await commitImg(r,stOne);
      for(const k of ['a','b']){ const s2=st[k]; if(!s2||!s2.changed) continue; const key='img'+k.toUpperCase(); const t={img:r[key]}; await commitImg(t,s2); r[key]=t.img||null; }
    }catch(e){ toast('이미지를 저장하지 못했어요'); return; }
    if(!D.pairs) D.pairs=[];
    const i=D.pairs.findIndex(x=>x.id===r.id); if(i<0) D.pairs.push(r); else D.pairs[i]=r;
    await save(); close(); render(); toast(isNew?'페어를 저장했어요':'수정했어요');
  };
  if(!isNew) $('del').onclick=()=>confirmBox(`'${r.name||pairName(r.a)+' × '+pairName(r.b)}' 페어를 삭제할까요?\n(캐릭터 자체는 지워지지 않아요)`,'삭제',async()=>{ D.pairs=D.pairs.filter(x=>x.id!==r.id); for(const id of [r.img,r.imgA,r.imgB]) if(id){ await imgDel(id).catch(()=>{}); IMG.delete(id); } await save(); close(); render(); toast('삭제했어요'); },()=>editPair(r0));
  if(isNew) setTimeout(()=>{ if(!modalEl.contains(document.activeElement)) $('f-name').focus(); },50);
}

/* ---------- 카테고리 ---------- */
function catModal(c){
  const isNew=!c, cs=cats();
  const hasKids=c && cs.some(x=>x.parent===c.id);
  const roots=cs.filter(x=>!x.parent && (!c || x.id!==c.id));
  modal(`<div class="v-dh"><b>${isNew?'＋ 새 카테고리':'카테고리 편집'}</b><button class="x" type="button">×</button></div>
    <div class="v-db v-fields">
      <div><label>이름</label><input type="text" id="v-c-name" value="${esc(c&&c.name)}" placeholder="예: 오리지널, 현대 AU, 화풍"></div>
      <div><label>상위 카테고리 (선택)</label><select id="v-c-parent" ${hasKids?'disabled':''}><option value="">없음 (맨 위)</option>${roots.map(r=>`<option value="${r.id}" ${c&&c.parent===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select>${hasKids?'<div style="font-size:11px;color:var(--sub);margin-top:4px">하위 카테고리가 있어서 맨 위에만 둘 수 있어요.</div>':''}</div>
    </div>
    <div class="v-df">${isNew?'':'<button type="button" class="danger" id="v-cdel">삭제</button>'}<span class="sp"></span><button type="button" data-close>취소</button><button type="button" class="primary" id="v-csave">저장</button></div>`,{sm:true});
  setTimeout(()=>{ if(!modalEl.contains(document.activeElement)) $('c-name').focus(); },50);
  $('c-name').onkeydown=e=>{ if(e.key==='Enter'&&!e.isComposing) $('csave').click(); };
  $('csave').onclick=async()=>{
    const name=$('c-name').value.trim(); if(!name){ toast('이름을 적어 주세요'); return; }
    const parent=$('c-parent').value||null;
    if(isNew){ const n={id:uid(),name,parent}; cs.push(n); U.cat[U.tab]=n.id; }
    else { c.name=name; if(!hasKids) c.parent=parent; }
    await save(); close(); saveUI(); render();
  };
  if(!isNew) $('cdel').onclick=()=>confirmBox(`'${c.name}' 카테고리를 삭제할까요?\n안에 있던 항목은 ${c.parent?'상위 카테고리':'미분류'}로 옮겨져요.`,'삭제',async()=>{
    items().forEach(it=>{ if(it.cat===c.id) it.cat=c.parent||null; });
    cs.forEach(x=>{ if(x.parent===c.id) x.parent=null; });
    const i=cs.findIndex(x=>x.id===c.id); cs.splice(i,1);
    if(U.cat[U.tab]===c.id) U.cat[U.tab]='all';
    await save(); close(); saveUI(); render(); toast('카테고리를 삭제했어요');
  },()=>catModal(c));
}
function confirmBox(msg,okLabel,onOk,onCancel){
  modal(`<div class="v-dh"><b>확인</b></div><div class="v-db" style="white-space:pre-wrap;line-height:1.7">${esc(msg)}</div><div class="v-df"><span class="sp"></span><button type="button" id="v-cno">취소</button><button type="button" class="primary" id="v-cok">${esc(okLabel)}</button></div>`,{sm:true,lock:true});
  $('cno').onclick=()=>{ onCancel?onCancel():close(); };
  $('cok').onclick=onOk;
}

/* ---------- 내보내기 · 불러오기 ---------- */
async function dump(){ return {app:'studio-vault', v:1, saved:new Date().toISOString(), data:D, images:await imgAll()}; }
$('export').onclick=async()=>{
  try{
    const txt=JSON.stringify(await dump());
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    const a=document.createElement('a'); a.href=url; a.download=`보관함백업_${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); toast('보관함을 파일로 내보냈어요');
  }catch(e){ toast('내보내지 못했어요'); }
};
$('import').onclick=()=>$('importFile').click();
$('importFile').onchange=()=>{ const f=$('importFile').files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $('importFile').value=''; let o; try{ o=JSON.parse(r.result); }catch(e){ toast('파일을 읽지 못했어요'); return; }
  if(!o||o.app!=='studio-vault'||!o.data){ toast('보관함 백업 파일이 아니에요'); return; }
  const np=(o.data.personas||[]).length, nq=(o.data.prompts||[]).length, nr=(o.data.pairs||[]).length;
  modal(`<div class="v-dh"><b>📂 보관함 불러오기</b><button class="x" type="button">×</button></div><div class="v-db" style="line-height:1.8">페르소나 <b>${np}</b>개, 프롬프트 <b>${nq}</b>개${nr?`, 페어 <b>${nr}</b>개`:''}가 들어 있어요.<br>· <b>합치기</b>: 지금 보관함은 그대로 두고, 없는 항목만 더해요.<br>· <b>바꾸기</b>: 지금 보관함을 지우고 파일 내용으로 바꿔요.</div><div class="v-df"><span class="sp"></span><button type="button" data-close>취소</button><button type="button" id="v-imMerge">합치기</button><button type="button" class="primary" id="v-imReplace">바꾸기</button></div>`,{sm:true});
  $('imMerge').onclick=()=>importData(o,false); $('imReplace').onclick=()=>importData(o,true);
}; r.readAsText(f); };
async function importData(o,replace){
  try{
    const inc=Object.assign(BLANK(),o.data), ims=o.images||{};
    if(replace){ await imgClear(); IMG.clear(); D=inc; for(const [k,v] of Object.entries(ims)) await imgSet(k,v); }
    else {
      for(const key of ['pcats','qcats','rcats','personas','prompts','pairs']){ if(!D[key]) D[key]=[]; const have=new Set(D[key].map(x=>x.id)); (inc[key]||[]).forEach(x=>{ if(!have.has(x.id)){ D[key].push(x); if(x.img && ims[x.img]){ imgSet(x.img,ims[x.img]); if(ims[ORIG(x.img)]) imgSet(ORIG(x.img),ims[ORIG(x.img)]); } } }); }
    }
    await save(); close(); render(); toast(replace?'보관함을 바꿨어요':'보관함에 합쳤어요');
  }catch(e){ toast('불러오지 못했어요: '+(e&&e.name||'오류')); }
}

/* ---------- 시작 ---------- */
document.querySelectorAll('#v-vside [data-vtab]').forEach(a=>a.onclick=e=>{ e.preventDefault(); if(modalEl&&modalEl.classList.contains('on')) close(); U.tab=a.dataset.vtab; U.tag=null; U.q=''; $('q').value=''; saveUI(); render(); window.scrollTo(0,0); });
document.querySelectorAll('.t-vault .v-tabs .tab').forEach(b=>b.onclick=()=>{ U.tab=b.dataset.tab; U.tag=null; U.q=''; $('q').value=''; saveUI(); render(); });
let qt; $('q').oninput=()=>{ clearTimeout(qt); qt=setTimeout(()=>{ U.q=$('q').value; render(); },120); };
$('sort').onchange=()=>{ U.sort=$('sort').value; saveUI(); render(); };
$('new').onclick=()=>U.tab==='persona'?editPersona(null):U.tab==='pair'?editPair(null):editPrompt(null);
(async()=>{
  try{ db=await openDB(); const d=await kvGet('data'); if(d && typeof d==='object') D=Object.assign(BLANK(),d); }
  catch(e){ $('grid').innerHTML='<div class="v-empty">이 브라우저에서는 보관함 저장소를 열 수 없어요.<br>시크릿 모드라면 일반 창에서 열어 주세요.</div>'; return; }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{ localStorage.setItem('vault-summary',JSON.stringify({p:D.personas.length,q:D.prompts.length,r:(D.pairs||[]).length})); }catch(e){}
  const hm=(location.hash||'').match(/^#(p|q|r|tab)=([\w-]+)$/);
  if(hm){ U.tab=hm[1]==='tab'?(TABS[hm[2]]?hm[2]:'persona'):{p:'persona',q:'prompt',r:'pair'}[hm[1]]; saveUI(); }
  render();
  if(hm && hm[1]!=='tab'){ const it=(D[TABS[U.tab].list]||[]).find(x=>x.id===hm[2]); if(it) hm[1]==='p'?viewPersona(it):hm[1]==='r'?editPair(it):editPrompt(it); }
  if(hm){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
})();
window.addEventListener('focus',async()=>{ if(!db||(modalEl&&modalEl.classList.contains('on'))) return; try{ const d=await kvGet('data'); if(d){ D=Object.assign(BLANK(),d); IMG.clear(); render(); } }catch(e){} });
})();
</script>
