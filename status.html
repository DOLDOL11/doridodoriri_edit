<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>상태창 메이커 V3 · 프리셋</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Gowun+Dodum&family=Jua&family=Nanum+Myeongjo&family=Orbitron:wght@400..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @font-face {
            font-family: 'NeoDunggeunmo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.3/NeoDunggeunmo.woff') format('woff');
        }

        @font-face {
            font-family: 'RIDIBatang';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');
        }

        @font-face {
            font-family: 'Galmuri11';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/Galmuri11.woff') format('woff');
        }

        @font-face {
            font-family: 'Paperlogy-Regular';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-Regular.woff2') format('woff2');
            font-weight: 400;
        }

        :root {
            /* 글자 효과(글리치 등)가 쓰는 색 */
            --pinkt: #d64973;
            --blue: #6baef2;
            --ink: #1a1a1a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eef1f5;
            font-family: "SUIT", "Apple SD Gothic Neo", sans-serif;
            color: #1a252f;
        }

        /* ============ 작업 화면 레이아웃 ============ */
        body.maker-app {
            height: 100vh;
            overflow: hidden;
        }

        .layout-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            flex: 0 0 auto;
            display: flex;
            height: 100%;
            background: #fff;
            border-right: 1px solid #dfe5ea;
            z-index: 5;
        }

        .rail {
            width: 66px;
            background: #1c1c1e;
            display: flex;
            flex-direction: column;
            padding: 10px 6px;
            gap: 4px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .rail::-webkit-scrollbar {
            display: none;
        }

        .rail-btn {
            background: none;
            border: none;
            color: #9ca3af;
            border-radius: 10px;
            padding: 10px 0 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 10.5px;
            font-family: inherit;
        }

        .rail-btn b {
            font-size: 19px;
            font-weight: 400;
            line-height: 1;
        }

        .rail-btn:hover {
            background: #2a2a2d;
            color: #fff;
        }

        .rail-btn.active {
            background: #3a3a3f;
            color: #fff;
        }

        .rail-btn.rail-bottom {
            margin-top: auto;
        }

        .rail-sub {
            display: none;
            flex-direction: column;
            gap: 2px;
            background: #26262a;
            border-radius: 10px;
            padding: 4px 2px;
            margin-bottom: 2px;
        }

        .rail.edit-open .rail-sub {
            display: flex;
        }

        .rail-btn.sub {
            padding: 6px 0 5px;
            font-size: 10px;
            gap: 2px;
        }

        .rail-btn.sub b {
            font-size: 15px;
        }

        .rail-btn.parent-active {
            color: #fff;
        }

        .rail-fold span::after {
            content: " ▸";
            font-size: 9px;
        }

        .rail.edit-open .rail-fold span::after {
            content: " ▾";
        }

        .controls-area {
            width: 380px;
            flex: none;
            height: 100%;
            overflow-y: auto;
            padding: 0 16px 24px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            position: sticky;
            top: 0;
            z-index: 3;
            margin: 0 -16px;
            padding: 16px 18px 12px;
            background: #f8fafc;
            border-bottom: 1px solid #e5eaef;
            font-size: 16px;
            font-weight: 800;
        }

        .ctrl-box {
            background: #fff;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid #e1e8ed;
        }

        .ctrl-box h3 {
            margin: 0 0 12px;
            font-size: 14.5px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
        }

        .controls-area[data-active="style"] .ctrl-box:not([data-tab="style"]),
        .controls-area[data-active="save"] .ctrl-box:not([data-tab="save"]),
        .controls-area[data-active^="grp-"] .ctrl-box:not([data-tab="fields"]) {
            display: none;
        }

        .sub-label {
            display: block;
            font-size: 11px;
            color: #64748b;
            font-weight: 700;
            margin: 2px 0 6px;
        }

        .muted-note {
            font-size: 11px;
            color: #64748b;
            margin: 8px 0 0;
            line-height: 1.5;
        }

        /* ---- 프리셋 카드 ---- */
        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .preset-card {
            position: relative;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            padding: 0;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            overflow: hidden;
            transition: border-color .15s, box-shadow .15s, transform .15s;
        }

        .preset-card:hover:not(:disabled) {
            border-color: #94a3b8;
            transform: translateY(-1px);
        }

        .preset-card.on {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .2);
        }

        .preset-card.on::after {
            content: "✓ 사용 중";
            position: absolute;
            top: 6px;
            right: 6px;
            background: #3b82f6;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .preset-thumb {
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .preset-meta {
            padding: 8px 10px 9px;
        }

        .preset-meta b {
            display: block;
            font-size: 12.5px;
        }

        .preset-meta span {
            display: block;
            font-size: 10.5px;
            color: #64748b;
            margin-top: 2px;
            line-height: 1.35;
        }

        .preset-card:disabled {
            cursor: default;
            opacity: .75;
        }

        .thumb-xray {
            background: radial-gradient(ellipse at 90% 0%, rgba(206, 198, 240, .7), transparent 55%), linear-gradient(160deg, #f4f7f8, #e4ecf2 50%, #e6e3f3);
            color: #5d6478;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }

        .thumb-xray i {
            font-style: italic;
            font-family: Georgia, serif;
            font-size: 15px;
            letter-spacing: 0;
            display: block;
            text-align: center;
        }

        .thumb-orbit {
            position: relative;
            justify-content: flex-start !important;
            padding: 0 12px;
            background: linear-gradient(180deg, #eef1f5, #e6eaf0);
            color: #141414;
            overflow: hidden;
        }

        .thumb-orbit div {
            position: relative;
            z-index: 1;
        }

        .thumb-orbit b {
            display: block;
            font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
            font-weight: 900;
            font-size: 17px;
            letter-spacing: -1px;
            line-height: .88;
        }

        .thumb-orbit span {
            display: inline-block;
            margin-top: 5px;
            padding: 1px 6px;
            background: #2f6fa8;
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 8.5px;
            letter-spacing: .5px;
        }

        .thumb-orbit i {
            position: absolute;
            right: -18px;
            top: 50%;
            width: 88px;
            height: 88px;
            margin-top: -44px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, rgba(110, 170, 235, .5), transparent 45%), linear-gradient(160deg, #0d1d36, #1b4275);
            box-shadow: inset 0 0 0 10px rgba(255, 255, 255, .06), 0 0 0 1px #141414;
        }

        .thumb-orbit i::before {
            content: "";
            position: absolute;
            inset: 22px;
            border-radius: 50%;
            border: 1px dashed rgba(190, 212, 235, .6);
        }

        .thumb-orbit i::after {
            content: "";
            position: absolute;
            left: 22px;
            top: 18px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 6px #fff, 0 0 12px #8cc3ff;
        }

        .thumb-dream {
            background: linear-gradient(180deg, #160c2b, #0c0718);
            color: #fff;
        }

        .thumb-dream span {
            background: linear-gradient(90deg, #34195e, #7d66cc 65%, #baaaf4);
            border: 2px solid;
            border-color: #e6dfff #3b2672 #3b2672 #e6dfff;
            padding: 3px 10px;
            font-family: Tahoma, sans-serif;
            font-size: 11px;
        }

        .thumb-record {
            background: linear-gradient(180deg, #46403c, #1f1c1a);
            font-family: Georgia, serif;
            font-size: 16px;
            letter-spacing: 3px;
        }

        .thumb-record span:first-child {
            color: #c0392b;
        }

        .thumb-record span:last-child {
            color: #d4af37;
        }

        .thumb-soon {
            background: repeating-linear-gradient(45deg, #f1f5f9 0 8px, #e2e8f0 8px 16px);
            color: #94a3b8;
            font-size: 22px;
        }

        /* ---- 버튼 묶음 ---- */
        .format-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .format-btns button {
            background: #f8f9fa;
            border: 1px solid #d1d9e0;
            border-radius: 7px;
            padding: 6px 11px;
            font-size: 12.5px;
            cursor: pointer;
            font-weight: 700;
            color: #333;
            font-family: inherit;
        }

        .format-btns button:hover {
            background: #e2e8f0;
        }

        .format-btns button.on {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        .save-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .save-btns button {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 9px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .save-btns button:hover {
            filter: brightness(.94);
        }

        .save-btns .copy-btn {
            background: #8b5cf6;
        }

        .save-btns .reset-btn {
            background: #ef4444;
            margin-top: 8px;
        }

        .slot-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .slot-name-row span {
            font-size: 12px;
            color: #64748b;
            white-space: nowrap;
        }

        #slot-btns-container button {
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ---- 입력칸 ---- */
        input[type="text"],
        textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-family: inherit;
            font-size: 12.5px;
            outline: none;
            background: #fff;
            transition: border .15s, box-shadow .15s;
        }

        textarea {
            resize: vertical;
            min-height: 54px;
            line-height: 1.5;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .12);
        }

        .field-sec {
            margin-bottom: 14px;
        }

        .field-sec:last-child {
            margin-bottom: 0;
        }

        .field-sec h4 {
            margin: 0 0 8px;
            font-size: 12.5px;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .field {
            margin-bottom: 9px;
        }

        .field label {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 4px;
        }

        .field label code {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #94a3b8;
            font-weight: 400;
        }

        .field .fmt-note {
            margin-left: auto;
            font-size: 10px;
            color: #8b5cf6;
            font-weight: 700;
            display: none;
        }

        .field.has-fmt .fmt-note {
            display: inline;
        }

        .field.flash input,
        .field.flash textarea {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .2);
        }

        .num-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .num-row input[type="range"] {
            flex: 1;
            accent-color: #3b82f6;
        }

        .num-row input[type="text"] {
            width: 62px;
            flex: none;
            text-align: center;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 8px;
        }

        /* ============ 미리보기 ============ */
        .preview-scroll {
            flex: 1;
            min-width: 0;
            height: 100%;
            overflow-y: auto;
            padding: 0 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-area {
            width: 600px;
            max-width: 100%;
            zoom: var(--pv-zoom, 1);
        }

        body.exporting .preview-area {
            zoom: 1;
        }

        /* 꺼 둔 블럭 */
        #capture-area [data-sec].sec-off {
            display: none !important;
        }

        #capture-area [data-sec].sec-ping {
            animation: sec-ping 1.2s ease-out;
        }

        @keyframes sec-ping {
            0% {
                outline: 3px solid rgba(59, 130, 246, .9);
                outline-offset: 2px;
            }

            100% {
                outline: 3px solid rgba(59, 130, 246, 0);
                outline-offset: 6px;
            }
        }

        /* ---- 편집: 보기 방식 전환 ---- */
        .seg {
            display: flex;
            gap: 4px;
            background: #eef2f6;
            border-radius: 11px;
            padding: 4px;
            margin-bottom: 12px;
        }

        .seg button {
            flex: 1;
            border: none;
            background: transparent;
            border-radius: 8px;
            padding: 8px 6px 7px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            color: #64748b;
            cursor: pointer;
            line-height: 1.25;
        }

        .seg button small {
            display: block;
            font-size: 10px;
            font-weight: 500;
            margin-top: 2px;
            color: #94a3b8;
        }

        .seg button.on {
            background: #fff;
            color: #1e293b;
            box-shadow: 0 1px 4px rgba(15, 23, 42, .1);
        }

        .seg button.on small {
            color: #64748b;
        }

        .jump-chips {
            position: sticky;
            top: 52px;
            z-index: 2;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 0 -16px 12px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, .95);
            border-bottom: 1px solid #eef2f6;
        }

        .jump-chips button {
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 11.5px;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            font-family: inherit;
        }

        .jump-chips button:hover {
            background: #e2e8f0;
        }

        .field-sec h4 {
            padding-top: 4px;
        }

        /* ---- 블럭 목록 (켜기/끄기 + 펼쳐서 편집) ---- */
        .blk-tools {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .blk-tools button {
            flex: 1;
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 7px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
        }

        .blk-tools button:hover {
            background: #cbd5e1;
        }

        details.blk {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            margin-bottom: 7px;
            overflow: hidden;
        }

        details.blk.child {
            margin-left: 16px;
        }

        details.blk>summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 2px 8px;
            padding: 9px 10px;
            font-size: 13px;
            font-weight: 700;
        }

        details.blk>summary::-webkit-details-marker {
            display: none;
        }

        details.blk>summary::after {
            content: "▸";
            margin-left: auto;
            order: 1;
            color: #94a3b8;
            font-size: 11px;
        }

        details.blk[open]>summary::after {
            content: "▾";
        }

        details.blk[open]>summary {
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
        }

        details.blk>summary input {
            width: 15px;
            height: 15px;
            margin: 0;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        .blk-sum {
            order: 2;
            flex: 0 0 100%;
            padding-left: 23px;
            font-size: 11px;
            font-weight: 400;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .blk-sum.empty {
            color: #b6c0cc;
            font-style: italic;
        }

        details.blk.is-off>summary {
            opacity: .5;
        }

        .blk-body {
            padding: 12px 12px 4px;
        }

        .blk-body .muted-note {
            margin: 0 0 10px;
        }

        .field.is-off {
            opacity: .45;
        }

        .field .off-note {
            margin-left: auto;
            font-size: 10px;
            color: #94a3b8;
            font-weight: 700;
            display: none;
        }

        .field.is-off .off-note {
            display: inline;
        }

        /* 미리보기 안의 입력 가능한 칸 */
        .fv {
            outline: none;
            border-radius: 3px;
            transition: background .15s, box-shadow .15s;
            cursor: text;
            min-width: 1ch;
        }

        .fv:hover {
            box-shadow: 0 0 0 1px rgba(107, 174, 242, .55);
        }

        .fv:focus {
            box-shadow: 0 0 0 1.5px #6baef2;
            background: rgba(107, 174, 242, .12);
        }

        .fv:empty::before {
            content: attr(data-ph);
            opacity: .45;
            font-style: italic;
            pointer-events: none;
        }

        .fv.ping {
            animation: fv-ping 1.2s ease-out;
        }

        @keyframes fv-ping {
            0% {
                box-shadow: 0 0 0 3px rgba(59, 130, 246, .9);
                background: rgba(59, 130, 246, .25);
            }

            100% {
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0);
                background: transparent;
            }
        }

        body.exporting .fv,
        body.exporting .fv:hover,
        body.exporting .fv:focus {
            box-shadow: none !important;
            background: transparent !important;
        }

        body.exporting .fv:empty::before {
            content: none;
        }

        body.exporting .typing {
            animation: none !important;
            max-width: none !important;
            border-right: none !important;
        }

        body.exporting .glitch,
        body.exporting .shake,
        body.exporting .sparkle {
            animation: none !important;
        }

        /* ---- 글꼴 바꾸기 (프리셋 기본이 아닐 때만) ----
           장식용 고정폭 글씨(Courier New)는 디자인이 깨지지 않게 그대로 둠 */
        [data-font="gothic"] *:not([style*="monospace"]):not([style*="monospace"] *) {
            font-family: "Gowun Dodum", sans-serif !important;
        }

        [data-font="myeongjo"] *:not([style*="monospace"]):not([style*="monospace"] *) {
            font-family: "Nanum Myeongjo", serif !important;
        }

        [data-font="batang"] *:not([style*="monospace"]):not([style*="monospace"] *) {
            font-family: "Gowun Batang", serif !important;
        }

        [data-font="ridi"] *:not([style*="monospace"]):not([style*="monospace"] *) {
            font-family: 'RIDIBatang', serif !important;
        }

        [data-font="pixel"] *:not([style*="monospace"]):not([style*="monospace"] *) {
            font-family: 'NeoDunggeunmo', monospace !important;
        }

        [data-font="galmuri"] *:not([style*="monospace"]):not([style*="monospace"] *) {
            font-family: 'Galmuri11', monospace !important;
        }

        [data-font="paperlogy"] *:not([style*="monospace"]):not([style*="monospace"] *) {
            font-family: 'Paperlogy-Regular', sans-serif !important;
        }

        [data-font="orbitron"] *:not([style*="monospace"]):not([style*="monospace"] *) {
            font-family: "Orbitron", "Gowun Dodum", sans-serif !important;
        }

        [data-font="suit"] *:not([style*="monospace"]):not([style*="monospace"] *) {
            font-family: "SUIT", sans-serif !important;
        }


        /* ============ 상단 고정 글자 도구 ============ */
        .text-bar {
            position: sticky;
            top: 0;
            z-index: 40;
            align-self: stretch;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 4px 6px;
            margin: 0 -20px 22px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid #dfe5ea;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
        }

        .tb-group {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-wrap: wrap;
        }

        .tb-sep {
            width: 1px;
            height: 20px;
            background: #dfe5ea;
            margin: 0 2px;
        }

        .tb-btn {
            border: 1px solid transparent;
            background: transparent;
            color: #334155;
            min-width: 30px;
            height: 30px;
            padding: 0 7px;
            border-radius: 7px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            line-height: 1;
            transition: background .15s, border-color .15s;
        }

        .tb-btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #e2e8f0;
        }

        .tb-btn:disabled {
            opacity: .35;
            cursor: default;
        }

        .tb-btn.on {
            background: #e0ecff;
            border-color: #bcd3fb;
            color: #1d4ed8;
        }

        .tb-chip {
            font-size: 12px;
            height: 28px;
            padding: 0 8px;
            background: #f8fafc;
            border-color: #e2e8f0;
        }

        .tb-chip.tb-dark {
            background: #1e293b;
            color: #fff;
            border-color: #0f172a;
        }

        .tb-chip.tb-dark:hover {
            background: #0f172a;
        }

        .tb-chip.on {
            background: #e0ecff;
            border-color: #3b82f6;
            color: #1d4ed8;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.18);
            font-weight: bold;
        }

        .tb-chip.tb-dark.on {
            background: #1e293b;
            color: #fff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.45);
        }

        .tb-chip.on::after {
            content: " ✓";
            font-size: 11px;
        }

        .tb-zoom-label {
            font-size: 12px;
            min-width: 46px;
        }

        .tb-color {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 7px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .tb-color:hover {
            background: #f1f5f9;
            border-color: #e2e8f0;
        }

        .tb-color-a {
            font-weight: bold;
            font-size: 14px;
            color: #334155;
            line-height: 1;
        }

        .tb-color-swatch {
            width: 16px;
            height: 3px;
            border-radius: 2px;
            margin-top: 2px;
            background: #d64973;
        }

        .tb-color input {
            position: absolute;
            inset: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            padding: 0;
            border: none;
            cursor: pointer;
        }

        .tb-hint {
            flex: 0 0 100%;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.2;
        }

        .text-bar.has-sel .tb-hint {
            color: #3b82f6;
        }

        .tb-hint.applied {
            color: #1d4ed8 !important;
            font-weight: bold;
        }

        /* 효과 메뉴 */
        .fx-wrap {
            position: relative;
        }

        .fx-btn {
            font-size: 12.5px;
            font-weight: 700;
            background: #f8fafc;
            border-color: #e2e8f0;
            white-space: nowrap;
        }

        .fx-btn .fx-caret {
            font-size: 9px;
            color: #94a3b8;
            margin-left: 2px;
        }

        .fx-btn.open,
        .fx-btn.on {
            background: #e0ecff;
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        .fx-pop {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, .16);
            padding: 6px;
            z-index: 60;
        }

        .fx-pop.open {
            display: block;
        }

        .fx-pop-head {
            font-size: 11.5px;
            font-weight: 800;
            color: #334155;
            padding: 6px 8px 8px;
        }

        .fx-pop-head small {
            font-weight: 500;
            color: #94a3b8;
            margin-left: 4px;
        }

        .fx-item {
            display: flex;
            width: 100%;
            align-items: baseline;
            gap: 8px;
            border: none;
            background: transparent;
            border-radius: 8px;
            padding: 7px 8px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
        }

        .fx-item b {
            font-size: 12.5px;
            color: #1e293b;
            white-space: nowrap;
        }

        .fx-item span {
            font-size: 10.5px;
            color: #94a3b8;
        }

        .fx-item:hover {
            background: #f1f5f9;
        }

        .fx-item.on {
            background: #e0ecff;
        }

        .fx-item.on b::after {
            content: " ✓";
            color: #1d4ed8;
        }

        /* 창 (빈칸 확인 · 도움말) */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 16px;
        }

        .modal {
            background: #fff;
            border-radius: 18px;
            width: 100%;
            max-width: 440px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(15, 23, 42, .3);
            padding: 22px 22px 18px;
            position: relative;
        }

        .modal h2 {
            margin: 0 0 6px;
            font-size: 18px;
        }

        .modal .m-sub {
            margin: 0 0 14px;
            font-size: 12.5px;
            color: #64748b;
            line-height: 1.55;
        }

        .modal .m-close {
            position: absolute;
            top: 12px;
            right: 12px;
            border: none;
            background: #f1f5f9;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            color: #475569;
        }

        .m-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .m-actions button {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 11px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            background: #f1f5f9;
            color: #334155;
        }

        .m-actions button.primary {
            background: #3b82f6;
            color: #fff;
        }

        .empty-list {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }

        .empty-row {
            padding: 10px 12px;
            border-bottom: 1px solid #eef2f6;
        }

        .empty-row:last-child {
            border-bottom: none;
        }

        .empty-row .er-head {
            display: flex;
            align-items: center;
            font-size: 12.5px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .empty-row .er-head em {
            margin-left: auto;
            font-style: normal;
            font-size: 11px;
            color: #ef4444;
            background: #fee2e2;
            border-radius: 999px;
            padding: 1px 8px;
        }

        .empty-row .er-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .empty-row .er-chips button {
            border: 1px dashed #cbd5e1;
            background: #f8fafc;
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 11.5px;
            color: #475569;
            cursor: pointer;
            font-family: inherit;
        }

        .empty-row .er-chips button:hover {
            border-style: solid;
            border-color: #3b82f6;
            color: #1d4ed8;
            background: #eff6ff;
        }

        .help-art {
            height: 120px;
            border-radius: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 40px;
            background: linear-gradient(135deg, #eef4ff, #f5f0ff);
        }

        .help-art small {
            font-size: 12px;
            font-weight: 800;
            color: #475569;
            background: #fff;
            border-radius: 8px;
            padding: 4px 9px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, .08);
        }

        .help-step ul {
            margin: 0;
            padding-left: 18px;
            font-size: 13px;
            line-height: 1.7;
            color: #334155;
        }

        .help-step ul b {
            color: #1e293b;
        }

        .help-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
        }

        .help-dots i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #cbd5e1;
            transition: width .2s;
        }

        .help-dots i.on {
            background: #3b82f6;
            width: 18px;
            border-radius: 4px;
        }

        body.exporting .text-bar {
            display: none;
        }

        /* ============ 휴대폰 ============ */
        @media (max-width: 768px) {
            body.maker-app {
                height: auto;
                overflow: auto;
            }

            .layout-container {
                flex-direction: column-reverse;
                height: auto;
                align-items: center;
                gap: 16px;
                padding: 0 0 12px;
            }

            .sidebar {
                flex-direction: column;
                width: calc(100% - 24px);
                max-width: 440px;
                height: auto;
                border: 1px solid #dfe5ea;
                border-radius: 14px;
                overflow: hidden;
            }

            .rail {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 6px;
            }

            .rail-btn {
                flex: 1;
            }

            .rail-btn.rail-bottom {
                margin-top: 0;
            }

            .rail-sub {
                flex: 0 0 100%;
                flex-direction: row;
                flex-wrap: wrap;
            }

            .rail-btn.sub {
                flex: 1 0 22%;
            }

            .controls-area {
                width: 100%;
                height: auto;
                overflow: visible;
            }

            .panel-title {
                position: static;
            }

            .preview-scroll {
                height: auto;
                overflow: visible;
                padding: 0 12px;
                width: 100%;
            }

            .text-bar {
                margin: 0 0 12px;
                border: 1px solid #dfe5ea;
                border-radius: 14px;
                padding: 6px 8px;
            }

            .text-bar .ft-zoom,
            .text-bar .tb-sep {
                display: none;
            }
        }

        /* ============ 글자 효과 ============ */

        /* 텍스트 애니메이션 이펙트 */
        .glitch {
            position: relative;
            display: inline-block;
            animation: glitch-anim 1.5s infinite;
            color: inherit;
        }

        @keyframes glitch-anim {

            0%,
            90% {
                transform: skew(0deg);
                text-shadow: none;
            }

            92% {
                transform: skew(-2deg);
                text-shadow: 1px 0 var(--pinkt), -1px 0 var(--blue);
            }

            95% {
                transform: skew(2deg);
                text-shadow: -1px 0 var(--pinkt), 1px 0 var(--blue);
            }

            98% {
                transform: skew(0deg);
                text-shadow: none;
            }

            100% {
                transform: skew(1deg);
                text-shadow: 1px 0 var(--pinkt), 0 0 var(--blue);
            }
        }

        .typing {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid currentColor;
            width: max-content;
            max-width: 0;
            animation: typing 1.8s steps(30, end) forwards, blink-caret 0.8s step-end infinite;
            vertical-align: bottom;
        }

        @keyframes typing {
            from {
                max-width: 0;
            }

            to {
                max-width: 100%;
            }
        }

        @keyframes blink-caret {

            from,
            to {
                border-color: transparent;
            }

            50% {
                border-color: currentColor;
            }
        }

        .blind {
            background-color: var(--ink);
            color: var(--ink);
            border-radius: 3px;
            transition: all 0.3s;
            user-select: none;
        }

        .blind:hover {
            background-color: transparent;
            color: inherit;
        }

        .shake {
            display: inline-block;
            animation: shk .4s infinite;
        }

        @keyframes shk {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-1px) rotate(-1deg)
            }

            75% {
                transform: translateX(1px) rotate(1deg)
            }
        }

        .hl {
            background: linear-gradient(transparent 55%, #fff176 55%);
            color: #222;
        }

        .neon {
            text-shadow: 0 0 4px currentColor, 0 0 10px var(--blue);
        }

        .sparkle {
            animation: spk 1.4s infinite;
        }

        @keyframes spk {

            0%,
            100% {
                opacity: 1;
                text-shadow: 0 0 0 transparent
            }

            50% {
                opacity: .8;
                text-shadow: 0 0 6px #ffd54f, 0 0 12px #ffd54f
            }
    </style>
</head>

<body class="maker-app">
    <div class="layout-container">

        <!-- === 왼쪽: 아이콘 레일 + 컨트롤 패널 === -->
        <aside class="sidebar">
            <nav class="rail">
                <a class="rail-btn" href="./" title="로그 백업 스튜디오로 돌아가기" style="text-decoration:none"><b>🏠</b><span>스튜디오</span></a>
                <button class="rail-btn active" data-tab="style" onmousedown="event.preventDefault()" onclick="switchTab('style')"><b>🎨</b><span>꾸미기</span></button>
                <button class="rail-btn" id="rail-edit" onmousedown="event.preventDefault()" onclick="toggleEditFold()" title="내용 편집"><b>✏️</b><span>편집</span></button>
                <button class="rail-btn" data-tab="save" onmousedown="event.preventDefault()" onclick="switchTab('save')"><b>💾</b><span>저장</span></button>
                <button class="rail-btn rail-bottom" onmousedown="event.preventDefault()" onclick="openHelp(0)" title="사용법 보기"><b>❓</b><span>도움말</span></button>
                <button class="rail-btn" onmousedown="event.preventDefault()" onclick="saveAsImage()" title="이미지(PNG)로 바로 저장"><b>📷</b><span>PNG</span></button>
            </nav>

            <div class="controls-area" id="controls" data-active="style">
                <div class="panel-title" id="panel-title">🎨 꾸미기</div>

                <!-- 꾸미기: 프리셋 + 글꼴 -->
                <div class="ctrl-box" data-tab="style">
                    <h3>🗂️ 프리셋</h3>
                    <div class="preset-grid" id="preset-grid"></div>
                    <p class="muted-note">프리셋을 바꿔도 적어 둔 내용은 그대로 옮겨져요.</p>
                </div>

                <div class="ctrl-box" data-tab="style">
                    <h3>🔤 글꼴</h3>
                    <div class="format-btns" id="font-btns"></div>
                    <p class="muted-note">'프리셋 기본'은 각 디자인에 맞춰 둔 원래 글꼴이에요. 장식용 고정폭 글씨는 다른 글꼴을 골라도 그대로 유지돼요.</p>
                </div>

                <!-- 편집: 입력칸 (묶음별로 보임) -->
                <div class="ctrl-box" data-tab="fields">
                    <div id="fields-box"></div>
                    <p class="muted-note">미리보기의 글자를 직접 눌러서 고쳐도 돼요. 칸을 누르면 미리보기의 해당 위치가 반짝여요.</p>
                </div>

                <!-- 저장 -->
                <div class="ctrl-box" data-tab="save">
                    <h3>📂 슬롯 (자동 저장)</h3>
                    <div class="format-btns" id="slot-btns-container"></div>
                    <div class="slot-name-row"><span>현재 슬롯 이름</span><input type="text" id="slot-name-input" maxlength="14" placeholder="예: 하윤" oninput="renameSlot(this.value)"></div>
                    <div class="format-btns" style="margin-top:10px">
                        <button onclick="exportJSON()">📤 파일로 백업</button>
                        <button onclick="document.getElementById('json-in').click()">📥 백업 불러오기</button>
                        <input type="file" id="json-in" accept=".json" style="display:none" onchange="importJSON(event)">
                    </div>
                </div>

                <div class="ctrl-box" data-tab="save">
                    <h3>💾 내보내기</h3>
                    <div class="save-btns">
                        <button onclick="saveAsImage()">📷 이미지로 저장 (PNG · 전부 펼친 모습)</button>
                        <button class="copy-btn" onclick="copyCleanHTML()">📋 HTML 코드 복사</button>
                        <button class="reset-btn" onclick="resetAll()">🗑️ 이 슬롯 비우기</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- === 오른쪽: 미리보기 === -->
        <div class="preview-scroll" id="preview-scroll">
            <div class="text-bar" id="text-bar">
                <div class="tb-group">
                    <button id="undo-btn" class="tb-btn" onmousedown="event.preventDefault()" onclick="undoHist()" title="되돌리기 (Ctrl+Z)" disabled>↶</button>
                    <button id="redo-btn" class="tb-btn" onmousedown="event.preventDefault()" onclick="redoHist()" title="다시 실행 (Ctrl+Shift+Z / Ctrl+Y)" disabled>↷</button>
                </div>
                <span class="tb-sep"></span>
                <div class="tb-group">
                    <button class="tb-btn tb-fmt" data-cmd="bold" onmousedown="event.preventDefault()" onclick="fmtCmd('bold')" title="굵게 (Ctrl+B)"><b>B</b></button>
                    <button class="tb-btn tb-fmt" data-cmd="italic" onmousedown="event.preventDefault()" onclick="fmtCmd('italic')" title="기울임 (Ctrl+I)"><i>I</i></button>
                    <button class="tb-btn tb-fmt" data-cmd="underline" onmousedown="event.preventDefault()" onclick="fmtCmd('underline')" title="밑줄 (Ctrl+U)"><u>U</u></button>
                    <button class="tb-btn tb-fmt" data-cmd="strikeThrough" onmousedown="event.preventDefault()" onclick="fmtCmd('strikeThrough')" title="취소선"><s>S</s></button>
                    <label class="tb-color" title="글자 색" onmousedown="saveTextSel()">
                        <span class="tb-color-a">A</span><span class="tb-color-swatch" id="tb-color-swatch"></span>
                        <input type="color" id="text-color-picker" value="#d64973" onchange="applyTextColor(this.value)">
                    </label>
                    <button class="tb-btn" onmousedown="event.preventDefault()" onclick="fmtCmd('removeFormat')" title="서식 지우기">⌫</button>
                </div>
                <span class="tb-sep"></span>
                <div class="tb-group fx-wrap">
                    <button class="tb-btn fx-btn" id="fx-btn" onmousedown="event.preventDefault()" onclick="toggleFxMenu()" title="글자 효과">✨ 효과 <span class="fx-caret">▾</span></button>
                    <div class="fx-pop" id="fx-pop">
                        <div class="fx-pop-head">고른 글자에 효과 넣기 <small>다시 누르면 풀려요</small></div>
                        <button class="fx-item" onmousedown="event.preventDefault()" data-fx="glitch" onclick="applyEffect('glitch')"><b>⚡ 글리치</b><span>은은하게 지직거려요</span></button>
                        <button class="fx-item" onmousedown="event.preventDefault()" data-fx="typing" onclick="applyEffect('typing')"><b>⌨️ 타이핑</b><span>한 글자씩 써져요</span></button>
                        <button class="fx-item" onmousedown="event.preventDefault()" data-fx="blind" onclick="applyEffect('blind')"><b>⬛ 검열</b><span>까맣게 가려요 (마우스를 올리면 보임)</span></button>
                        <button class="fx-item" onmousedown="event.preventDefault()" data-fx="shake" onclick="applyEffect('shake')"><b>📳 흔들림</b><span>달달 떨려요</span></button>
                        <button class="fx-item" onmousedown="event.preventDefault()" data-fx="hl" onclick="applyEffect('hl')"><b>🖍️ 형광펜</b><span>노란 형광펜을 칠해요</span></button>

    <script type="text/plain" id="fx-css-src">
        /* 텍스트 애니메이션 이펙트 */
        .glitch {
            position: relative;
            display: inline-block;
            animation: glitch-anim 1.5s infinite;
            color: inherit;
        }

        @keyframes glitch-anim {

            0%,
            90% {
                transform: skew(0deg);
                text-shadow: none;
            }

            92% {
                transform: skew(-2deg);
                text-shadow: 1px 0 var(--pinkt), -1px 0 var(--blue);
            }

            95% {
                transform: skew(2deg);
                text-shadow: -1px 0 var(--pinkt), 1px 0 var(--blue);
            }

            98% {
                transform: skew(0deg);
                text-shadow: none;
            }

            100% {
                transform: skew(1deg);
                text-shadow: 1px 0 var(--pinkt), 0 0 var(--blue);
            }
        }

        .typing {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid currentColor;
            width: max-content;
            max-width: 0;
            animation: typing 1.8s steps(30, end) forwards, blink-caret 0.8s step-end infinite;
            vertical-align: bottom;
        }

        @keyframes typing {
            from {
                max-width: 0;
            }

            to {
                max-width: 100%;
            }
        }

        @keyframes blink-caret {

            from,
            to {
                border-color: transparent;
            }

            50% {
                border-color: currentColor;
            }
        }

        .blind {
            background-color: var(--ink);
            color: var(--ink);
            border-radius: 3px;
            transition: all 0.3s;
            user-select: none;
        }

        .blind:hover {
            background-color: transparent;
            color: inherit;
        }

        .shake {
            display: inline-block;
            animation: shk .4s infinite;
        }

        @keyframes shk {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-1px) rotate(-1deg)
            }

            75% {
                transform: translateX(1px) rotate(1deg)
            }
        }

        .hl {
            background: linear-gradient(transparent 55%, #fff176 55%);
            color: #222;
        }

        .neon {
            text-shadow: 0 0 4px currentColor, 0 0 10px var(--blue);
        }

        .sparkle {
            animation: spk 1.4s infinite;
        }

        @keyframes spk {

            0%,
            100% {
                opacity: 1;
                text-shadow: 0 0 0 transparent
            }

            50% {
                opacity: .8;
                text-shadow: 0 0 6px #ffd54f, 0 0 12px #ffd54f
            }
</script>

            // 태그 안(스타일 값)의 {{변수}}는 그대로 두고, 글자 자리의 {{변수}}만 입력 칸으로 바꿈
            const html = tpl.replace(/<[^>]+>|\{\{([^}]+)\}\}/g, (m, k) => k === undefined ? m : `<span class="fv" data-k="${esc(k)}"></span>`);
            area.innerHTML = html;
            area.setAttribute('data-font', state.font || 'preset');

            attrBinds = [];
            area.querySelectorAll('*').forEach(el => {
                for (const a of [...el.attributes]) {
                    if (a.value.includes('{{')) attrBinds.push({
                        el,
                        attr: a.name,
                        tpl: a.value
                    });
                }
            });
            area.querySelectorAll('.fv').forEach(sp => {
                const k = sp.dataset.k;
                const d = FIELD[k];
                sp.setAttribute('contenteditable', 'true');
                sp.setAttribute('spellcheck', 'false');
                sp.setAttribute('data-ph', d ? d.label : k);
                sp.innerHTML = state.f[k] || '';
            });
            applyAttrBinds();
            // 편집할 때는 접히는 칸을 전부 펼쳐 둠
            area.querySelectorAll('details').forEach(d => d.open = true);
            applyOff();
            buildSecMap();
        }

        function offList() {
            return state.off[state.preset] || [];
        }

        function isOff(id) {
            return offList().includes(id);
        }

        function applyOff() {
            document.querySelectorAll('#capture-area [data-sec]').forEach(el => el.classList.toggle('sec-off', isOff(el.dataset.sec)));
        }

        // 블럭마다 어떤 칸이 들어 있는지
        let secKeys = {},
            otherKeys = [];

        function buildSecMap() {
            secKeys = {};
            const other = new Set();
            document.querySelectorAll('#capture-area .fv').forEach(sp => {
                const sec = sp.closest('[data-sec]');
                const k = sp.dataset.k;
                if (!sec) other.add(k);
                else(secKeys[sec.dataset.sec] = secKeys[sec.dataset.sec] || new Set()).add(k);
            });
            otherKeys = FIELDS.map(f => f[0]).filter(k => other.has(k));
        }

        // 그 칸이 보이는 곳이 하나라도 남아 있는지
        function keyVisible(k) {
            return [...document.querySelectorAll('#capture-area .fv[data-k="' + CSS.escape(k) + '"]')].some(sp => !sp.closest('.sec-off'));
        }

        function setSecOn(id, on) {
            const list = offList().filter(x => x !== id);
            if (!on) list.push(id);
            state.off[state.preset] = list;
            applyOff();
            refreshBlockRows();
            scheduleSave(true);
            if (on) pingSection(id);
        }

        function setAllSecs(on) {
            state.off[state.preset] = on ? [] : (SECTIONS[state.preset] || []).map(x => x[0]);
            applyOff();
            renderFields();
            scheduleSave(true);
        }

        // 미리보기 바깥 스크롤만 움직여서 그 자리를 보여줌
        // (scrollIntoView 는 디자인 틀 안쪽까지 밀어 올려서 화면이 깨짐)
        function scrollPreviewTo(el) {
            const ps = document.getElementById('preview-scroll');
            const r = el.getBoundingClientRect();
            const scroller = (ps.scrollHeight > ps.clientHeight + 2 && getComputedStyle(ps).overflowY !== 'visible') ? ps : null;
            if (scroller) {
                const pr = ps.getBoundingClientRect();
                ps.scrollBy({
                    top: r.top - pr.top - ps.clientHeight / 2 + r.height / 2,
                    behavior: 'smooth'
                });
            } else {
                window.scrollBy({
                    top: r.top - window.innerHeight / 2 + r.height / 2,
                    behavior: 'smooth'
                });
            }
        }

        // 디자인 틀 안쪽이 혹시라도 밀려 올라가면 바로 제자리로
        document.getElementById('capture-area').addEventListener('scroll', e => {
            const t = e.target;
            if (t !== document.getElementById('capture-area') && t.nodeType === 1 && (t.scrollTop || t.scrollLeft)) {
                const ov = getComputedStyle(t);
                if (ov.overflow === 'hidden' || ov.overflowY === 'hidden' || ov.overflowX === 'hidden' || ov.overflow === 'clip') {
                    t.scrollTop = 0;
                    t.scrollLeft = 0;
                }
            }
        }, true);

        function pingSection(id) {
            const el = document.querySelector('#capture-area [data-sec="' + id + '"]');
            if (!el || el.classList.contains('sec-off')) return;
            scrollPreviewTo(el);
            el.classList.remove('sec-ping');
            void el.offsetWidth;
            el.classList.add('sec-ping');
        }

        function applyAttrBinds() {
            attrBinds.forEach(b => b.el.setAttribute(b.attr, b.tpl.replace(/\{\{([^}]+)\}\}/g, (m, k) => numOf(k))));
        }

        // 같은 변수가 여러 군데 있을 때 나머지 칸도 맞춰 줌
        function syncSpans(k, except) {
            document.querySelectorAll('#capture-area .fv[data-k="' + CSS.escape(k) + '"]').forEach(sp => {
                if (sp !== except && sp.innerHTML !== (state.f[k] || '')) sp.innerHTML = state.f[k] || '';
            });
            if (FIELD[k] && FIELD[k].type === 'num') applyAttrBinds();
        }

        function commitSpan(sp) {
            if (!sp) return;
            let h = sp.innerHTML;
            if (h === '<br>' || h === '&nbsp;') {
                h = '';
                sp.innerHTML = '';
            }
            const k = sp.dataset.k;
            state.f[k] = h;
            syncSpans(k, sp);
            syncPanelField(k);
            scheduleSave();
        }

        function spanOfNode(n) {
            if (!n) return null;
            if (n.nodeType === 3) n = n.parentNode;
            return n && n.closest ? n.closest('#capture-area .fv') : null;
        }

        function commitSelectionSpans() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const r = sel.getRangeAt(0);
            const a = spanOfNode(r.startContainer),
                b = spanOfNode(r.endContainer);
            commitSpan(a);
            if (b && b !== a) commitSpan(b);
        }

        // 미리보기에서 직접 고칠 때
        const area0 = document.getElementById('capture-area');
        area0.addEventListener('input', e => {
            const sp = e.target.closest && e.target.closest('.fv');
            if (sp) commitSpan(sp);
        });
        area0.addEventListener('keydown', e => {
            const sp = e.target.closest && e.target.closest('.fv');
            if (!sp) return;
            if (e.key === 'Enter') {
                e.preventDefault();
                const d = FIELD[sp.dataset.k];
                if (d && d.type !== 'long') return sp.blur();
                document.execCommand('insertLineBreak');
            }
            // 접히는 칸 제목 안에서 띄어쓰기를 눌러도 칸이 접히지 않게
            if (e.key === ' ' && sp.closest('summary')) e.stopPropagation();
        });
        area0.addEventListener('keyup', e => {
            if (e.key === ' ' && e.target.closest && e.target.closest('summary .fv')) e.preventDefault();
        });
        area0.addEventListener('click', e => {
            // 접히는 칸 제목 안의 입력 칸을 눌러도 칸이 열리고 닫히지 않게
            if (e.target.closest('.fv') && e.target.closest('summary')) e.preventDefault();
        });
        area0.addEventListener('paste', e => {
            const sp = e.target.closest && e.target.closest('.fv');
            if (!sp) return;
            e.preventDefault();
            const t = (e.clipboardData || window.clipboardData).getData('text/plain');
            document.execCommand('insertText', false, t);
        });
        area0.addEventListener('focusin', e => {
            const sp = e.target.closest && e.target.closest('.fv');
            if (sp) markPanelField(sp.dataset.k);
        });

        // ==========================================
        // 🗂️ 왼쪽 패널
        // ==========================================
        function renderPresetCards() {
            document.getElementById('preset-grid').innerHTML = PRESETS.map(p => `
                <button class="preset-card${p.id === state.preset ? ' on' : ''}" ${p.soon ? 'disabled' : `onclick="setPreset('${p.id}')"`}>
                    <div class="preset-thumb thumb-${p.id}">${p.thumb}</div>
                    <div class="preset-meta"><b>${p.name}</b><span>${p.desc}</span></div>
                </button>`).join('');
        }

        function renderFontBtns() {
            document.getElementById('font-btns').innerHTML = FONTS.map(([id, nm]) =>
                `<button class="${(state.font || 'preset') === id ? 'on' : ''}" onclick="setFont('${id}')">${nm}</button>`).join('');
        }

        function setPreset(id) {
            if (!TEMPLATES[id] || state.preset === id) return;
            state.preset = id;
            renderPresetCards();
            renderPreview();
            renderFields();
            renderRailSub();
            scheduleSave(true);
        }

        function setFont(id) {
            state.font = id;
            document.getElementById('capture-area').setAttribute('data-font', id);
            renderFontBtns();
            scheduleSave(true);
        }

        let fieldSeq = 0;

        function fieldHTML(d, sec) {
            const id = 'fld-' + d.key + (sec ? '-' + (++fieldSeq) : '');
            const val = esc(htmlToText(state.f[d.key] || ''));
            let input;
            if (d.type === 'num') {
                input = `<div class="num-row"><input type="range" min="0" max="100" step="1" value="${numOf(d.key)}" data-k="${esc(d.key)}" data-role="range"><input type="text" id="${id}" value="${val}" data-k="${esc(d.key)}" placeholder="${esc(d.hint)}"></div>`;
            } else if (d.type === 'long') {
                input = `<textarea id="${id}" rows="2" data-k="${esc(d.key)}" placeholder="${esc(d.hint)}">${val}</textarea>`;
            } else {
                input = `<input type="text" id="${id}" value="${val}" data-k="${esc(d.key)}" placeholder="${esc(d.hint)}">`;
            }
            const off = !sec && !keyVisible(d.key);
            return `<div class="field${hasFormatting(state.f[d.key]) ? ' has-fmt' : ''}${off ? ' is-off' : ''}" data-field="${esc(d.key)}"${sec ? ` data-in-sec="${sec}"` : ''}>
                <label for="${id}">${esc(d.label)} <code>{{${esc(d.key)}}}</code><span class="fmt-note">✨ 서식 있음</span><span class="off-note">꺼진 블럭에만 있어요</span></label>${input}</div>`;
        }

        // 편집 화면 맨 위: 보기 방식 전환
        function editHeader(tab) {
            return `<div class="seg">
                <button class="${tab === 'grp-blocks' ? 'on' : ''}" onclick="switchTab('grp-blocks', true)">🧱 블럭별<small>화면에 보이는 블럭 순서 · 켜기/끄기</small></button>
                <button class="${tab === 'grp-items' ? 'on' : ''}" onclick="switchTab('grp-items', true)">📝 항목별<small>종류끼리 모아서 한 번에 쓰기</small></button>
            </div>`;
        }

        function renderFields() {
            const used = USED[state.preset];
            const tab = document.getElementById('controls').getAttribute('data-active');
            if (tab === 'grp-blocks') return renderBlockRows();
            let chips = '',
                html = '';
            GROUPS.forEach(([g, icon, short, title]) => {
                const fs = FIELDS.filter(f => f[1] === g && used.has(f[0])).map(f => FIELD[f[0]]);
                if (!fs.length) return;
                chips += `<button onclick="jumpGroup('${g}')">${icon} ${short}</button>`;
                html += `<div class="field-sec" id="sec-${g}"><h4>${title}</h4>${fs.map(d => fieldHTML(d)).join('')}</div>`;
            });
            document.getElementById('fields-box').innerHTML = editHeader(tab) + `<div class="jump-chips">${chips}</div>` + html;
        }

        function jumpGroup(g) {
            const el = document.getElementById('sec-' + g);
            const area = document.getElementById('controls');
            if (!el) return;
            const top = el.getBoundingClientRect().top - area.getBoundingClientRect().top + area.scrollTop - 110;
            area.scrollTo({
                top,
                behavior: 'smooth'
            });
        }

        // ---- 블럭 목록 ----
        const openRows = new Set();

        function blockSummary(keys) {
            const t = [...keys].map(k => htmlToText(state.f[k] || '').replace(/\s+/g, ' ').trim()).filter(x => x && !/^\d+$/.test(x)).join(' · ');
            return t;
        }

        function renderBlockRows() {
            const secs = SECTIONS[state.preset] || [];
            const tree = {};
            document.querySelectorAll('#capture-area [data-sec]').forEach(el => {
                const par = el.parentElement.closest('[data-sec]');
                tree[el.dataset.sec] = par ? par.dataset.sec : null;
            });
            let h = `<p class="muted-note" style="margin:0 0 10px">체크로 블럭을 <b>켜고 끄고</b>, 줄을 누르면 그 블럭에 들어가는 칸이 열려요.</p>
                <div class="blk-tools"><button onclick="setAllSecs(true)">✅ 모두 켜기</button><button onclick="setAllSecs(false)">❌ 모두 끄기</button></div>`;
            const row = (id, label, keys, child, toggle) => {
                const ks = keys ? FIELDS.map(f => f[0]).filter(k => keys.has(k)) : [];
                const sum = blockSummary(ks);
                const kids = secs.filter(s => tree[s[0]] === id);
                const parentOff = child && isOff(tree[id]);
                let body = '';
                if (ks.length) body = ks.map(k => fieldHTML(FIELD[k], id)).join('');
                else if (kids.length) body = `<p class="muted-note">아래 ${kids.length}개 블럭을 한꺼번에 담은 묶음이에요. 끄면 안에 든 블럭이 전부 사라져요.</p>`;
                else body = `<p class="muted-note">적을 칸이 없는 꾸밈용 블럭이에요.</p>`;
                return `<details class="blk${child ? ' child' : ''}${toggle && (isOff(id) || parentOff) ? ' is-off' : ''}" data-row="${id}"${openRows.has(id) ? ' open' : ''}>
                    <summary>${toggle ? `<input type="checkbox" ${isOff(id) ? '' : 'checked'} onclick="event.stopPropagation()" onchange="setSecOn('${id}', this.checked)">` : '<span style="width:15px"></span>'}<span>${esc(label)}</span>
                    <span class="blk-sum${sum ? '' : ' empty'}">${sum ? esc(sum) : (ks.length ? '비어 있음' : '꾸밈 블럭')}</span></summary>
                    <div class="blk-body">${body}</div></details>`;
            };
            if (otherKeys.length) h += row('_top', '🔖 머리말 · 공통 칸', new Set(otherKeys), false, false);
            secs.forEach(([id, label]) => {
                h += row(id, label, secKeys[id] || new Set(), !!tree[id], true);
            });
            const box = document.getElementById('fields-box');
            box.innerHTML = editHeader('grp-blocks') + h;
            box.querySelectorAll('details.blk').forEach(d => d.addEventListener('toggle', () => {
                if (d.open) {
                    openRows.add(d.dataset.row);
                    if (d.dataset.row !== '_top') pingSection(d.dataset.row);
                } else openRows.delete(d.dataset.row);
            }));
        }

        function refreshBlockRows() {
            const tab = document.getElementById('controls').getAttribute('data-active');
            if (tab === 'grp-blocks') {
                const sc = document.getElementById('controls').scrollTop;
                renderBlockRows();
                document.getElementById('controls').scrollTop = sc;
            } else if (tab.startsWith('grp-')) renderFields();
        }

        function syncPanelField(k) {
            document.querySelectorAll('.field[data-field="' + CSS.escape(k) + '"]').forEach(wrap => syncOneField(wrap, k));
            document.querySelectorAll('details.blk').forEach(d => {
                const id = d.dataset.row;
                const keys = id === '_top' ? new Set(otherKeys) : secKeys[id];
                if (!keys || !keys.has(k)) return;
                const s = blockSummary(FIELDS.map(f => f[0]).filter(x => keys.has(x)));
                const el = d.querySelector('.blk-sum');
                el.textContent = s || '비어 있음';
                el.classList.toggle('empty', !s);
            });
        }

        function syncOneField(wrap, k) {
            const inp = wrap.querySelector('input[type="text"], textarea');
            const t = htmlToText(state.f[k] || '');
            if (inp && document.activeElement !== inp && inp.value !== t) inp.value = t;
            if (!inp) return;
            const rg = wrap.querySelector('[data-role="range"]');
            if (rg && document.activeElement !== rg) rg.value = numOf(k);
            wrap.classList.toggle('has-fmt', hasFormatting(state.f[k]));
        }

        function markPanelField(k) {
            document.querySelectorAll('.field[data-field="' + CSS.escape(k) + '"]').forEach(wrap => {
                wrap.classList.add('flash');
                setTimeout(() => wrap.classList.remove('flash'), 900);
            });
        }

        // 패널에서 고칠 때
        const fieldsBox = document.getElementById('fields-box');
        fieldsBox.addEventListener('input', e => {
            const el = e.target;
            const k = el.dataset.k;
            if (!k) return;
            if (el.dataset.role === 'range') {
                state.f[k] = el.value;
                const t = el.closest('.field').querySelector('input[type="text"]');
                if (t) t.value = el.value;
            } else {
                state.f[k] = textToHtml(el.value);
                const rg = el.closest('.field').querySelector('[data-role="range"]');
                if (rg) rg.value = numOf(k);
            }
            el.closest('.field').classList.toggle('has-fmt', false);
            syncSpans(k, null);
            syncPanelField(k);
            scheduleSave();
        });
        fieldsBox.addEventListener('focusin', e => {
            const k = e.target.dataset && e.target.dataset.k;
            if (k) pingPreview(k, e.target.closest('[data-in-sec]')?.dataset.inSec);
        });

        // 패널 칸을 누르면 미리보기에서 그 자리를 찾아 보여줌 (접힌 칸이면 펼침)
        function pingPreview(k, sec) {
            const all = [...document.querySelectorAll('#capture-area .fv[data-k="' + CSS.escape(k) + '"]')].filter(x => !x.closest('.sec-off'));
            const sp = (sec && sec !== '_top' ? all.find(x => x.closest('[data-sec]')?.dataset.sec === sec) : null) || all.find(x => !x.closest('[data-sec]')) || all[0];
            if (!sp) return;
            let d = sp.parentElement;
            while (d) {
                if (d.tagName === 'DETAILS' && !d.open) d.open = true;
                d = d.parentElement;
            }
            scrollPreviewTo(sp);
            sp.classList.remove('ping');
            void sp.offsetWidth;
            sp.classList.add('ping');
        }

        // ---- 탭 전환 ----
        function renderRailSub() {}

        function _oldRenderRailSub() {
            const used = USED[state.preset];
            const cur = document.getElementById('controls').getAttribute('data-active');
            let h = `<button class="rail-btn sub${cur === 'grp-blocks' ? ' active' : ''}" data-tab="grp-blocks" onmousedown="event.preventDefault()" onclick="switchTab('grp-blocks')"><b>🧱</b><span>블럭</span></button>`;
            GROUPS.forEach(([g, icon, short]) => {
                if (!FIELDS.some(f => f[1] === g && used.has(f[0]))) return;
                h += `<button class="rail-btn sub${cur === 'grp-' + g ? ' active' : ''}" data-tab="grp-${g}" onmousedown="event.preventDefault()" onclick="switchTab('grp-${g}')"><b>${icon}</b><span>${short}</span></button>`;
            });
            document.getElementById('rail-sub').innerHTML = h;
        }

        function tabTitle(tab) {
            if (tab === 'style') return '🎨 꾸미기';
            if (tab === 'save') return '💾 저장';
            return '✏️ 편집';
        }

        function isValidTab(tab) {
            return tab === 'style' || tab === 'save' || tab === 'grp-blocks' || tab === 'grp-items';
        }

        function switchTab(tab, keepScroll) {
            if (!isValidTab(tab)) {
                // 예전 묶음 탭(기본·마음…)은 항목별로, 그 밖의 예전 편집 탭은 블럭별로
                if (GROUPS.some(g => 'grp-' + g[0] === tab)) tab = 'grp-items';
                else tab = String(tab || '').startsWith('grp-') || tab === 'blocks' ? 'grp-blocks' : 'style';
            }
            const area = document.getElementById('controls');
            const inEdit = tab.startsWith('grp-');
            area.setAttribute('data-active', tab);
            document.querySelectorAll('.rail-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            document.getElementById('rail-edit').classList.toggle('active', inEdit);
            document.getElementById('panel-title').textContent = tabTitle(tab);
            if (inEdit) renderFields();
            if (!keepScroll) area.scrollTop = 0;
            try {
                localStorage.setItem('makerTab', tab);
                if (inEdit) localStorage.setItem('makerEditTab', tab);
            } catch (e) {}
        }

        function toggleEditFold() {
            const tab = document.getElementById('controls').getAttribute('data-active');
            if (!tab.startsWith('grp-')) {
                let last = 'grp-blocks';
                try {
                    last = localStorage.getItem('makerEditTab') || last;
                } catch (e) {}
                // 예전 버전에서 남은 탭 이름이면 블럭 화면으로
                if (!last.startsWith('grp-')) last = 'grp-blocks';
                switchTab(last);
            }
        }

        // ==========================================
        // 💾 저장 · 슬롯 · 되돌리기
        // ==========================================
        let hist = [],
            histIdx = -1,
            saveTimer = null;
        const HIST_MAX = 100;

        function getSlotNum() {
            try {
                return localStorage.getItem('makerSlot') || '1';
            } catch (e) {
                return '1';
            }
        }

        function slotKey(n) {
            return STORE_PREFIX + (n || getSlotNum());
        }

        function scheduleSave(now) {
            clearTimeout(saveTimer);
            if (now) return saveNow();
            saveTimer = setTimeout(saveNow, 350);
        }

        function saveNow() {
            clearTimeout(saveTimer);
            const json = JSON.stringify(state);
            if (hist[histIdx] !== json) {
                hist.length = histIdx + 1;
                hist.push(json);
                if (hist.length > HIST_MAX) hist.shift();
                histIdx = hist.length - 1;
            }
            updateUndoUI();
            try {
                localStorage.setItem(slotKey(), json);
            } catch (e) {
                showToast('⚠️ 저장 공간이 부족해요. 파일로 백업해 주세요.');
            }
        }

        function applyState(s) {
            state = Object.assign(blankState(), s || {});
            state.f = Object.assign(blankState().f, (s && s.f) || {});
            state.off = Object.assign({}, (s && s.off) || {});
            if (!TEMPLATES[state.preset]) state.preset = 'orbit';
            if (!FONTS.some(f => f[0] === state.font)) state.font = 'preset';
            renderPresetCards();
            renderFontBtns();
            renderPreview();
            renderRailSub();
            renderFields();
        }

        function updateUndoUI() {
            document.getElementById('undo-btn').disabled = histIdx <= 0;
            document.getElementById('redo-btn').disabled = histIdx >= hist.length - 1;
        }

        function undoHist() {
            if (histIdx <= 0) return;
            histIdx--;
            restoreHist();
        }

        function redoHist() {
            if (histIdx >= hist.length - 1) return;
            histIdx++;
            restoreHist();
        }

        function restoreHist() {
            applyState(JSON.parse(hist[histIdx]));
            try {
                localStorage.setItem(slotKey(), hist[histIdx]);
            } catch (e) {}
            updateUndoUI();
        }

        document.addEventListener('keydown', e => {
            const mod = e.ctrlKey || e.metaKey;
            if (!mod) return;
            const k = e.key.toLowerCase();
            if (k === 's') {
                e.preventDefault();
                saveNow();
                showToast('💾 저장했어요');
                return;
            }
            const inField = e.target.isContentEditable || /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
            if (inField) return; // 글을 쓰는 중에는 브라우저 기본 되돌리기
            if (k === 'z' && !e.shiftKey) {
                e.preventDefault();
                undoHist();
            } else if ((k === 'z' && e.shiftKey) || k === 'y') {
                e.preventDefault();
                redoHist();
            }
        });

        let savedTextRange = null;

        function selInPreview() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return null;

        function restoreTextSel() {
            if (selInPreview()) return true;
            if (!savedTextRange || !document.contains(savedTextRange.startContainer)) return false;

            sel.removeAllRanges();
            sel.addRange(savedTextRange);
