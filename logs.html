<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그 보관함 · Log Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{color-scheme:light;--bg:#eef5fb;--panel:#fff;--ink:#25313c;--sub:#687989;--line:#dbe7f2;--accent:#5a9fd8;--accent-d:#3f80ba;--accent-soft:#e6f1fb;--ok:#2f7fb8}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:14px}
  textarea,select,input,button{color:var(--ink)}
  ::placeholder{color:#a1b0be}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  .nav{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
  .brand{font-weight:700;font-size:16px;padding:0 10px 4px;letter-spacing:-.3px}
  .brand-sub{font-size:12px;color:var(--sub);padding:0 10px 18px}
  .nav-label{font-size:11px;color:#97a7b6;padding:12px 10px 6px;letter-spacing:.06em}
  .nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
  .nav a:hover{background:#eff5fa}
  .nav a.on{background:var(--accent-soft);color:var(--accent-d);font-weight:700}
  .nav a .ic{width:22px;text-align:center}
  .nav .foot{margin-top:auto;font-size:12px;color:#97a7b6;padding:10px;line-height:1.6}
  .main{min-width:0}
  .view{display:none;padding:24px 28px 48px;max-width:1500px}
  .view.on{display:block}
  .view > header h1{margin:0 0 4px;font-size:21px;letter-spacing:-.4px}
  .view > header p{margin:0 0 20px;color:var(--sub);line-height:1.6}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .nav{position:sticky;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);z-index:20}
    .brand{padding:0 8px 0 2px;white-space:nowrap}
    .brand-sub,.nav-label,.nav .foot{display:none}
    .nav a{white-space:nowrap}
    .view{padding:16px 14px 40px}
  }

  /* home */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;text-decoration:none;color:var(--ink);display:block;transition:border-color .15s,transform .15s}
  .tile:hover{border-color:var(--accent);transform:translateY(-2px)}
  .tile .ic{font-size:26px}
  .tile h3{margin:10px 0 6px;font-size:16px}
  .tile p{margin:0;color:var(--sub);line-height:1.6;font-size:13px}
  .tile .use{margin-top:12px;font-size:12px;color:var(--accent-d);font-weight:500}
  .tile.soon{border-style:dashed;cursor:default;color:#97a7b6}
  .tile.soon:hover{border-color:var(--line);transform:none}

  /* ---------- shared components ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
  .step{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;align-items:center;justify-content:center;flex:none}
  textarea{width:100%;border:1px solid #d2e0ed;border-radius:8px;padding:10px 12px;font:inherit;line-height:1.6;resize:vertical;background:#fbfdff}
  textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  textarea.mono{font:12px/1.5 ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  select,input[type=text]{font:inherit;padding:5px 8px;border:1px solid #d2e0ed;border-radius:6px;background:#fff}
  button{font:inherit;cursor:pointer;border:1px solid #d2e0ed;background:#fff;border-radius:8px;padding:6px 12px}
  button:hover{background:#edf4fa}
  .btn{border:0;border-radius:8px;padding:9px 16px;font-weight:700}
  .btn.primary,button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover,button.primary:hover{background:var(--accent-d)}
  .btn.ghost{background:#eef0f3}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .hint{color:#8596a7;font-size:12px;line-height:1.6;margin:6px 0 0}
  .status{font-size:12px;color:var(--sub)}
  .status.ok{color:var(--ok)} .status.warn{color:#b45309}
  label{font-size:13px}
  .chk{display:flex;gap:6px;align-items:center}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2f2d;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  details summary{cursor:pointer;color:var(--accent-d);font-size:13px}

</style>
<style>
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line)}
  .topbar a{color:var(--accent-d);text-decoration:none;font-size:13px}
  .topbar b{font-size:14px}
  .view.solo{display:block}
  @media (max-width:900px){.topbar{padding:10px 14px}}
</style>
<style>
  /* ---------- 하늘색 테마 ---------- */
  html,body{background:linear-gradient(180deg,#d9ebfa 0px,#e8f3fc 280px,#f1f7fd 700px) fixed;background-color:#f1f7fd}
  .card{background:rgba(255,255,255,.9);border-color:#d9e7f3;box-shadow:0 4px 18px rgba(90,159,216,.07)}
  .tile{background:rgba(255,255,255,.88);box-shadow:0 4px 18px rgba(90,159,216,.08)}
  .tile:hover{box-shadow:0 8px 26px rgba(90,159,216,.16)}
  .topbar,.nav{background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .step{background:linear-gradient(135deg,#7cc0f0,#4f8fd0)}
  .btn.primary,button.primary{background:linear-gradient(135deg,#6db3ea,#4c8fd0);border-color:#4f93d2}
  .btn.primary:hover,button.primary:hover{background:linear-gradient(135deg,#5ea6e0,#3f80ba)}
  ::selection{background:#cfe6fb}
</style>
<style>
  /* ---------- 로그 보관함 ---------- */
  html,body{height:100%}
  body.t-logs-app{overflow:hidden}
  .lk{display:grid;grid-template-columns:290px minmax(0,1fr);height:calc(100vh - 57px)}
  .lk-side{display:flex;flex-direction:column;background:#fff;border-right:1px solid #e4ebf2;min-height:0}
  .lk-sh{padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #eef2f6}
  .lk-sh .row{display:flex;gap:8px}
  .lk-sh .row .primary{flex:1;border-radius:12px;padding:10px 12px;font-weight:700}
  .lk-sh .row .ib{width:42px;padding:0;border-radius:12px;font-size:16px}
  .lk-sh input[type=search]{width:100%;border-radius:12px!important;padding:9px 12px;background:#f7f9fc}
  .lk-list{flex:1;overflow-y:auto;padding:10px 10px 20px}
  .lk-lbl{font-size:11px;font-weight:700;letter-spacing:.12em;color:#9aa8b6;padding:12px 8px 6px;font-family:'Outfit',sans-serif}
  .lk-fd{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:700;color:#3a4450;user-select:none}
  .lk-fd:hover{background:#f4f7fb}
  .lk-fd .car{width:14px;color:#9aa8b6;font-size:10px;transition:transform .15s}
  .lk-fd.closed .car{transform:rotate(-90deg)}
  .lk-fd .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .lk-fd .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lk-fd .n{font-size:11.5px;color:#a3b0bd;font-weight:500}
  .lk-fd .ed{opacity:0;border:0;background:transparent;padding:0 4px;font-size:12px;color:#8a97a4}
  .lk-fd:hover .ed{opacity:1}
  .lk-fd.drop{background:#e7f1fb;outline:1.5px dashed #8db9e6}
  .lk-fc{padding-left:10px}
  .lk-fc.closed{display:none}
  .lk-ch{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;cursor:pointer;font-size:13.5px;color:#4a5563}
  .lk-ch:hover{background:#f4f7fb}
  .lk-ch.on{background:#e7f1fb;color:#1d2430;font-weight:700}
  .lk-ch .em{width:20px;text-align:center;flex:none}
  .lk-ch .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lk-ch .n{font-size:11px;color:#a3b0bd;font-weight:500}
  .lk-ch.drag{opacity:.45}
  .lk-nodrop{padding:6px 10px;font-size:12px;color:#a3b0bd}
  .lk-sf{padding:10px 16px;border-top:1px solid #eef2f6;font-size:11.5px;color:#9aa8b6;display:flex;gap:8px;align-items:center}
  .lk-sf button{font-size:12px;padding:5px 10px;border-radius:9px}
  .lk-sf .sp{flex:1}

  .lk-main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#f7f9fc}
  .lk-head{display:flex;align-items:center;gap:10px;padding:14px 22px;background:#fff;border-bottom:1px solid #e4ebf2}
  .lk-head .menu{display:none;width:38px;height:38px;padding:0;border-radius:11px;font-size:16px}
  .lk-head .tt{flex:1;min-width:0;cursor:pointer}
  .lk-head .tt b{display:block;font-size:17px;color:#1d2430;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lk-head .tt small{display:block;font-size:12px;color:#8a97a4;margin-top:2px}
  .lk-head .acts{display:flex;gap:6px}
  .lk-head .acts button{width:38px;height:38px;padding:0;border-radius:11px;font-size:15px}
  .lk-sbar{display:none;align-items:center;gap:6px;padding:8px 22px;background:#fff;border-bottom:1px solid #e4ebf2}
  .lk-sbar.on{display:flex}
  .lk-sbar input{flex:1;border-radius:10px!important;padding:8px 12px}
  .lk-sbar .cnt{font-size:12px;color:#8a97a4;min-width:54px;text-align:center}
  .lk-sbar button{width:34px;height:34px;padding:0;border-radius:10px}
  .lk-scroll{flex:1;overflow-y:auto;padding:24px 22px 30px;scroll-behavior:auto}
  .lk-turns{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

  .tn{position:relative;background:#fff;border:1px solid #e4ebf2;border-radius:20px;padding:18px 22px 16px;content-visibility:auto;contain-intrinsic-size:auto 220px}
  .tn-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .tn-no{font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;color:#3f80ba;background:#e7f1fb;border-radius:999px;padding:3px 10px;cursor:pointer}
  .tn-h .sp{flex:1}
  .tn-h .tb{opacity:0;transition:opacity .15s;display:flex;gap:4px}
  .tn:hover .tn-h .tb,.tn:focus-within .tn-h .tb{opacity:1}
  .tn-h .tb button{font-size:11.5px;padding:3px 9px;border-radius:999px}
  .tn-body{font-size:15px;line-height:1.85;color:#2d3440;word-break:keep-all;overflow-wrap:anywhere}
  .tn-body p{margin:0 0 .7em}
  .tn-body p:last-child{margin-bottom:0}
  .tn-body p.tight{margin-bottom:.15em}
  .tn-body .nar{color:var(--nar,#6a7280)}
  .tn-body .dlg{color:var(--dlg,#1f3f7a);font-weight:500}
  .tn-user{margin:10px 0;padding:12px 16px;border-radius:14px;background:#f6f3fe;border-left:3px solid #a58bea}
  .tn-user .who{font-size:11px;font-weight:700;color:#7a5fd0;letter-spacing:.06em;margin-bottom:4px;font-family:'Outfit',sans-serif}
  .tn-user .dlg{color:#5a3fc0}
  .tn-user .nar{color:#8f8aa6}
  .st{margin:12px 0;border:1px solid #dfe8f3;border-radius:14px;background:#f6f9fd;overflow:hidden}
  .st > summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:700;color:#2f5f96;background:#eaf2fc;list-style:none}
  .st > summary::-webkit-details-marker{display:none}
  .st > summary::before{content:"▸ ";color:#8db9e6}
  .st[open] > summary::before{content:"▾ "}
  .st .sb{padding:10px 16px 12px;font-size:13.5px;line-height:1.7}
  .st .kv{display:grid;grid-template-columns:minmax(80px,max-content) 1fr;gap:2px 14px;padding:3px 0;border-bottom:1px dashed #e3ebf4}
  .st .kv:last-child{border-bottom:0}
  .st .kv b{color:#4f6a88;font-weight:600}
  .st .sec{font-weight:700;color:#2f5f96;margin:8px 0 2px}
  .st .li{padding-left:14px;position:relative}
  .st .li::before{content:"•";position:absolute;left:2px;color:#8db9e6}
  .st .pl{color:#4a5563}
  .st-html{margin:12px 0;border:1px solid #e4ebf2;border-radius:14px;overflow:hidden;background:#fff}
  .st-html iframe{display:block;width:100%;border:0;min-height:60px}
  .st-code summary{background:#f3f3f6;color:#6b7280}
  .st-code pre{margin:0;padding:12px 14px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto;color:#4a5563}
  mark.hit{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
  mark.hit.cur{background:#f59e0b;color:#fff}

  .lk-comp{border-top:1px solid #e4ebf2;background:#fff;padding:10px 22px 14px}
  .lk-comp .in{max-width:820px;margin:0 auto}
  .lk-comp .cm{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .lk-comp .cm .seg button{font-size:12.5px}
  .lk-comp .cm .sp{flex:1}
  .lk-comp .cm label{font-size:12.5px;color:#6b7785;display:flex;align-items:center;gap:5px}
  .lk-comp .cm .fold{font-size:12px;border:0;background:transparent;color:#8a97a4;padding:2px 6px}
  .lk-comp textarea{width:100%;min-height:96px;max-height:40vh;resize:vertical;border-radius:14px!important;padding:12px 14px;font-size:14px;line-height:1.6}
  .lk-comp .cf{display:flex;align-items:center;gap:8px;margin-top:8px}
  .lk-comp .cf small{flex:1;font-size:11.5px;color:#9aa8b6}
  .lk-comp .cf .primary{border-radius:12px;padding:9px 22px;font-weight:700}
  .lk-comp.min textarea,.lk-comp.min .cf{display:none}

  .lk-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;color:#7a8794}
  .lk-empty .ic{width:64px;height:64px;border-radius:20px;background:#e7f1fb;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px}
  .lk-empty h2{margin:0 0 8px;font-size:19px;color:#1d2430}
  .lk-empty p{margin:0;font-size:13.5px;line-height:1.7}
  .lk-empty .box{margin-top:18px;padding:12px 18px;border:1px solid #e4ebf2;border-radius:14px;background:#fff;font-size:12.5px;line-height:1.8}

  /* 모달 */
  .lk-ov{position:fixed;inset:0;background:rgba(25,40,60,.32);display:none;align-items:flex-start;justify-content:center;padding:9vh 16px;z-index:100;overflow-y:auto}
  .lk-ov.on{display:flex}
  .lk-md{width:min(520px,100%);background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(30,60,90,.2);padding:22px 24px}
  .lk-md h3{margin:0 0 14px;font-size:16px;color:#1d2430}
  .lk-md .f{margin-bottom:12px}
  .lk-md .f > label{display:block;font-size:12.5px;font-weight:600;color:#5b6673;margin-bottom:6px}
  .lk-md input[type=text],.lk-md select,.lk-md textarea,.lk-md input[type=number]{width:100%;padding:10px 12px;font-size:14px}
  .lk-md textarea{min-height:240px;font-size:13.5px;line-height:1.6}
  .lk-md .two{display:grid;grid-template-columns:90px 1fr;gap:10px}
  .lk-md .ft{display:flex;align-items:center;gap:8px;margin-top:16px}
  .lk-md .ft .sp{flex:1}
  .lk-md .ft .danger{color:#c0504d;border-color:#f1d4d3}
  .lk-md .desc{font-size:12.5px;color:#7a8794;margin:-6px 0 12px;line-height:1.6}
  .lk-colors{display:flex;gap:6px;flex-wrap:wrap}
  .lk-colors button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px #dde6ef}
  .lk-colors button.on{box-shadow:0 0 0 2px #3f80ba}
  .lk-dim{display:none}

  @media (max-width:860px){
    .lk{grid-template-columns:1fr;height:calc(100vh - 49px)}
    .lk-side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:90;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.15)}
    .lk-side.open{transform:none}
    .lk-dim.on{display:block;position:fixed;inset:0;background:rgba(25,40,60,.3);z-index:80}
    .lk-head{padding:10px 12px}
    .lk-head .menu{display:block}
    .lk-head .acts button{width:34px;height:34px}
    .lk-scroll{padding:14px 10px 20px}
    .tn{padding:14px 15px 12px;border-radius:16px}
    .tn-body{font-size:14.5px}
    .tn-h .tb{opacity:1}
    .lk-comp{padding:8px 10px 10px}
    .lk-sbar{padding:8px 12px}
  }
  .lk-sh input[type=search],.lk-sbar input[type=search]{border:1px solid #e1e8ef!important;-webkit-appearance:none;appearance:none;box-shadow:none}
  .lk-sh .row .ib{height:42px;background:#fff;border:1px solid #dde6ef}
  .lk-sf span:first-child{white-space:nowrap}
  .lk-sf button{white-space:nowrap}
  @media (max-width:860px){ .lk-comp textarea{min-height:64px} .lk-comp .cm{margin-bottom:6px} }
  .lk-site{width:100%;border-radius:12px;font-size:12.5px;padding:8px 10px;color:#3f80ba;background:#f4f8fc;border:1px dashed #bcd8f2}
  .lk-site:hover{background:#e7f1fb}
  .tn-cmd{display:inline-block;margin:2px 0 12px;padding:4px 12px;border-radius:999px;background:#f1ecfd;color:#6a4fc8;font-size:12.5px;font-weight:600}
  /* --- 크기 줄이기 · 유저 바탕 없애기 · 상태창 구분 --- */
  .lk-turns{max-width:740px;gap:10px}
  .tn{padding:14px 18px 12px;border-radius:16px}
  .tn-h{margin-bottom:6px}
  .tn-no{font-size:11px;padding:2px 8px}
  .tn-body{font-size:14px;line-height:1.75}
  .tn-body p{margin:0 0 .35em}
  .tn-user{margin:6px 0 10px;padding:0;background:none;border:0;border-radius:0}
  .tn-user .who{font-size:10px;color:#a3aebb;margin-bottom:2px}
  .tn-user .dlg{color:#4a5563;font-weight:500}
  .tn-user .nar{color:#8a93a0}
  .st-tail{margin-top:12px;padding-top:10px;border-top:1px dashed #d5dfea;font-size:12.5px;line-height:1.7;color:#5b6673}
  .st-tail p{margin:0 0 .15em}
  .st-tail .nar{color:#5b6673}
  .st-tail .dlg{color:#3f5f86;font-weight:500}
  .st-inline{margin:8px 0;max-width:100%;overflow:hidden}
  .st-inline img{width:auto!important;max-width:100%!important;max-height:340px;height:auto;display:block;border-radius:10px;margin:8px 0}
  .st-inline pre{max-height:none}
  .st{margin:8px 0}
  .st .sb{font-size:12.5px}
  @media (max-width:860px){ .tn-body{font-size:13.5px} .st-inline img{max-height:280px} }
  .nm-tag{font-weight:700;color:#3f5f86}
  .nm-bar{color:#c3ccd6}
  .tn-user .dlg{color:var(--udlg,#2d3440)!important;font-weight:500}
  .tn-user .nar{color:#9aa3ae!important}
  .nc-list{display:flex;flex-wrap:wrap;gap:8px}
  .nc{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border:1px solid #e4ebf2;border-radius:999px;font-size:13px;font-weight:600;color:#3a4450;cursor:pointer}
  .nc input[type=color]{width:26px;height:26px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
  .nc input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .nc input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
  .nc small{font-size:10.5px;color:#a3b0bd;font-weight:500}
  .lk-main{position:relative}

<script>
(function(){
'use strict';
/* ---------- 기본 ---------- */
const $=id=>document.getElementById('lk-'+id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>Date.now();
function toast(m){ const t=document.getElementById('toast'); if(!t) return; t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2400); }
async function copyText(t,msg){ try{ await navigator.clipboard.writeText(t); toast(msg||'복사했어요'); }catch(e){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); toast(msg||'복사했어요'); }catch(_){ toast('복사하지 못했어요'); } a.remove(); } }
function download(name,text,type){ const url=URL.createObjectURL(new Blob([text],{type:type||'text/plain;charset=utf-8'})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }
const ymd=t=>{ const d=new Date(t); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; };
const md=t=>{ const d=new Date(t); return `${d.getMonth()+1}.${d.getDate()}`; };

/* ---------- 저장소 (IndexedDB) ---------- */
let S={v:1, chats:[], folders:[]};
let UI={active:null, q:'', mode:'one', zero:false, min:false};
try{ Object.assign(UI, JSON.parse(localStorage.getItem('logs-ui')||'{}')); }catch(e){}
const saveUI=()=>{ try{ localStorage.setItem('logs-ui',JSON.stringify({active:UI.active,mode:UI.mode,zero:UI.zero,min:UI.min,hideSt:UI.hideSt})); }catch(e){} };
function db(){ return new Promise((res,rej)=>{ const r=indexedDB.open('studio-logs',1); r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function load(){ try{ const d=await db(); const v=await new Promise(res=>{ const g=d.transaction('kv').objectStore('kv').get('state'); g.onsuccess=()=>res(g.result); g.onerror=()=>res(null); }); d.close(); if(v&&Array.isArray(v.chats)) S=v; }catch(e){ toast('저장소를 열지 못했어요'); } if(!S.folders) S.folders=[]; }
let _st=null;
function save(){ clearTimeout(_st); _st=setTimeout(doSave,250); }
async function doSave(){ _st=null; try{ const d=await db(); await new Promise((res,rej)=>{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(S,'state'); t.oncomplete=res; t.onerror=()=>rej(t.error); }); d.close();
  try{ localStorage.setItem('logs-summary',JSON.stringify({c:S.chats.length,t:S.chats.reduce((n,c)=>n+(c.turns||[]).length,0)})); localStorage.setItem('studioTouch:logs',String(now())); }catch(e){} }catch(e){ toast('저장하지 못했어요. 저장 공간을 확인해 주세요'); } }
window.addEventListener('beforeunload',()=>{ if(_st){ clearTimeout(_st); doSave(); } });
const chat=()=>S.chats.find(c=>c.id===UI.active)||null;

/* ---------- 로그 나누기 · 해석 ---------- */
function turnNoOf(raw){ const m=String(raw).match(/(\d+)\s*턴/); return m?parseInt(m[1],10):null; }
/* 겹치는 턴 찾기: 공백 · 턴 번호 · 이미지 주소 차이는 무시하고 비교 */
function norm(raw){ return plain(raw).replace(/https?:\/\/\S+/g,'').replace(/[\[#(]*\s*\d+\s*턴\s*[\])]*/g,'').replace(/[​-‍﻿]/g,'').replace(/\s+/g,'').slice(0,4000); }
/* 들어온 턴들 중 이미 있는 마지막 턴의 '바로 다음'부터만 골라낸다 */
function newPart(c,parts){
  const have=(c.turns||[]).map(t=>norm(t.raw)); if(!have.length) return {fresh:parts,skip:0,found:false};
  const inc=parts.map(norm); const set=new Set(have);
  for(let j=have.length-1;j>=0;j--){ const k=inc.lastIndexOf(have[j]); if(k>=0){ const rest=parts.slice(k+1).filter((p,i)=>!set.has(inc[k+1+i])); return {fresh:rest,skip:parts.length-rest.length,found:true}; } }
  return {fresh:parts.filter((p,i)=>!set.has(inc[i])),skip:parts.filter((p,i)=>set.has(inc[i])).length,found:false};
}
/* 길어서 다음 메시지로 넘어간 답변(유저 입력 없이 이어진 캐릭터 턴)은 앞 턴에 합친다 */
const isCmd=t=>{ t=String(t||'').trim(); return /^\/\S+$/.test(t)||/^\(shortcut:[^)]*\)$/i.test(t); };
const hasUser=t=>/^\s*\[유저\]/.test(String(t));
const CONT='<!--lk-cont-->';
/* 새 답변처럼 시작하면(*서술*, "대사") 끊긴 조각이 아니라 자동진행 같은 새 턴으로 본다 */
const looksFresh=t=>/^\s*(\[캐릭터\]\s*)?(\*|["“「『])/.test(String(t));
const isCont=t=>!hasUser(t)&&!looksFresh(t);
const joinCont=(a,b)=>String(a).replace(/\s+$/,'')+'\n\n'+CONT+'\n\n'+String(b).replace(/^\s+/,'');
const plain=t=>String(t||'').split('\n\n'+CONT+'\n\n').join('\n\n').split(CONT).join('');
/* 복사 · TXT용: 단축어만 있는 유저 입력(/자동진행 등)은 빼고 */
const clean=t=>plain(t).replace(/^\s*\[유저\]\s*\n\s*(\/\S+|\(shortcut:[^)\n]*\))\s*\n+(\s*\[캐릭터\]\s*\n)?/i,'');
function mergeCont(parts){
  if(!parts.some(hasUser)) return parts;
  const out=[]; parts.forEach(p=>{ if(out.length&&isCont(p)) out[out.length-1]=joinCont(out[out.length-1],p); else out.push(p); }); return out;
}
function lastNo(c){ const ts=c.turns||[]; if(!ts.length) return -1; const t=ts[ts.length-1]; const n=effNo(c,t,ts.length-1); return isNaN(+n)?ts.length-1:+n; }
function overlap(c,parts){ const have=new Set((c.turns||[]).map(t=>norm(t.raw))); let n=0; parts.forEach(p=>{ if(have.has(norm(p))) n++; }); return n; }
function guardDetails(text,fn){ const g=[]; const t=text.replace(/<details[\s\S]*?<\/details>|```[\s\S]*?```|\[\[(HTML|JSX)\]\][\s\S]*?\[\[\/\1\]\]/gi,m=>{ g.push(m); return '\u0000'+(g.length-1)+'\u0000'; }); return fn(t).map(p=>p.replace(/\u0000(\d+)\u0000/g,(m,i)=>g[+i])); }
function splitBulk(text){
  text=String(text).replace(/\r\n/g,'\n');
  return guardDetails(text,t=>{
    if(/\n[ \t]*([-=—─_])\1{2,}[ \t]*\n/.test('\n'+t+'\n')) return ('\n'+t+'\n').split(/\n[ \t]*(?:[-=—─_]){3,}[ \t]*(?=\n)/);
    if(/(^|\n)[^\n]{0,20}\[\s*\d+\s*턴/.test(t)) return t.split(/(?=(?:^|\n)[^\n]{0,20}\[\s*\d+\s*턴)/);
    if(/(^|\n)\s*(?:#+\s*)?\d+\s*턴\s*(\n|$)/.test(t)) return t.split(/(?=(?:^|\n)\s*(?:#+\s*)?\d+\s*턴\s*(?:\n|$))/);
    return [t];
  }).map(s=>s.trim()).filter(Boolean);
}
const strip=h=>String(h).replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|li|tr|h\d)>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
function parseTurn(raw){
  const blocks=[]; let text=String(raw||'').replace(/\r\n/g,'\n');
  const re=/\[\[JSX\]\]([\s\S]*?)\[\[\/JSX\]\]|\[\[HTML\]\]([\s\S]*?)\[\[\/HTML\]\]|```html[ \t]*\n?([\s\S]*?)(?:\n?```|$)|<details[^>]*>([\s\S]*?)<\/details>/gi;
  let li=0, m;
  while((m=re.exec(text))){
    if(m.index>li) textBlocks(text.slice(li,m.index),blocks);
    if(m[1]!=null) blocks.push({k:'code',title:'JSX 상태창 (여기서는 미리보기 없이 코드로 보여요)',src:m[1].trim()});
    else if(m[4]!=null) blocks.push({k:'status',...parseDetails(m[4])});
    else { const h=(m[2]!=null?m[2]:m[3])||''; if(h.trim()) blocks.push({k:'html',src:h.trim()}); }
    li=m.index+m[0].length;
  }
  if(li<text.length) textBlocks(text.slice(li),blocks);
  return blocks;
}
function parseDetails(inner){
  let title='상태창'; const sm=inner.match(/<summary[^>]*>([\s\S]*?)<\/summary>/i); if(sm) title=strip(sm[1]).trim()||title;
  const body=strip(inner.replace(/<summary[^>]*>[\s\S]*?<\/summary>/i,'')).split('\n').map(x=>x.trim()).filter(Boolean);
  const items=body.map(t=>{
    const l=t.match(/^(?:[-*•·]|\d+[.)])\s+(.*)$/); if(l) return {t:'li',v:l[1]};
    const p=t.indexOf('|'); if(p>0&&p<60) return {t:'kv',k:t.slice(0,p).trim(),v:t.slice(p+1).trim()};
    const c=t.match(/^([^:：]{1,24})[:：]\s*(.+)$/); if(c) return {t:'kv',k:c[1].trim(),v:c[2].trim()};
    if(t.length<=36&&(/^\[.*\]$/.test(t)||/^[\u{1F300}-\u{1FAFF}☀-➿]/u.test(t))) return {t:'sec',v:t};
    return {t:'pl',v:t};
  });
  return {title,items};
}
function textBlocks(t,blocks){
  let mode='prose', buf=[];
  const flush=()=>{ const s=buf.join('\n').trim(); if(s) blocks.push({k:mode,text:s}); buf=[]; };
  t.split('\n').forEach(line=>{
    const s=line.trim();
    if(/^\[(유저|user|나|USER)\]$/i.test(s)){ flush(); mode='user'; return; }
    if(/^\[(캐릭터|character|ai|봇|char|AI)\]$/i.test(s)){ flush(); mode='prose'; return; }
    if(/^[#\s]*\[?\s*\d+\s*턴\s*\]?\s*$/.test(s)) return; /* 턴 번호만 있는 줄은 숨김 */
    if(s===CONT) return;
    buf.push(line);
  });
  flush();
}
/* 이름표: "성준언 | "대사"" 처럼 줄 앞의 이름 */
const NAME_RE=/^([^\s|:："'“”「『*\[\]()0-9][^|:："'“”「『*\[\]()]{0,14}?)\s*\|\s*/;
let NC={};  /* 지금 채팅의 인물 색 */
function nameTag(line){ const m=line.match(NAME_RE); if(!m) return null; const nm=m[1].trim(); if(!nm||nm.length>15) return null; const col=NC[nm]; return {html:`<span class="nm-tag"${col?` style="color:${esc(col)}"`:''}>${esc(nm)}</span><span class="nm-bar"> | </span>`, rest:line.slice(m[0].length)}; }
function inline(line,isUser){
  const qre=/(["“][^"”]*["”]|「[^」]*」|『[^』]*』)/g;
  if(isUser&&!qre.test(line)) return `<span class="dlg">${esc(line)}</span>`; /* 유저: 별표 밖 = 대사 */
  qre.lastIndex=0;
  if(qre.test(line)){ return line.split(qre).map((seg,i)=>i%2?`<span class="dlg">${esc(seg)}</span>`:(seg.trim()?`<span class="nar">${esc(seg)}</span>`:esc(seg))).join(''); }
  return `<span class="nar">${esc(line)}</span>`;
}
/* *별표* 서술이 여러 줄에 걸쳐 있어도 한 덩어리로 보고, 그 안의 줄바꿈은 이어 붙인다 */
function prose(text,isUser){
  const hasStar=/\*[^*]+\*/.test(text);
  const isMsg=l=>/^\[[\s\S]*\]$/.test(l);
  let html='';
  const lineOut=(segs)=>{ /* segs: [{n:서술여부, t}] */
    const raw=segs.map(x=>x.t).join('').trim(); if(!raw) return '';
    let pre=''; if(segs.length&&!segs[0].n){ const tg=nameTag(segs[0].t.replace(/^\s+/,'')); if(tg){ pre=tg.html; segs=[{n:false,t:tg.rest},...segs.slice(1)]; } }
    return `<p>${pre}${segs.map(x=>x.n?`<span class="nar">${esc(x.t)}</span>`:(x.t.trim()?inline(x.t,isUser):esc(x.t))).join('')}</p>`;
  };
  if(hasStar){
    const toks=[]; let i=0, inN=false, buf='';
    while(i<text.length){ const ch=text[i]; if(ch==='*'){ const close=inN?true:text.indexOf('*',i+1)>i; if(close){ toks.push({n:inN,t:buf}); buf=''; inN=!inN; i++; continue; } } buf+=ch; i++; }
    toks.push({n:inN,t:buf});
    const lines=[[]];
    toks.forEach(tk=>{ const t=tk.n?tk.t.replace(/\s*\n+\s*/g,' '):tk.t; t.split('\n').forEach((pt,k)=>{ if(k>0) lines.push([]); if(pt) lines[lines.length-1].push({n:tk.n,t:pt}); }); });
    lines.forEach(ln=>{ html+=lineOut(ln); });
    return html;
  }
  const lines=text.split('\n');
  lines.forEach((l,i)=>{ const s=l.trim(); if(!s) return; const nx=(lines[i+1]||'').trim(); const o=lineOut([{n:false,t:s}]); html+=isMsg(s)&&isMsg(nx)?o.replace('<p>','<p class="tight">'):o; });
  return html;
}
/* 인물 이름 모으기 (색 지정용) */
function speakers(c){ const cnt={}; (c.turns||[]).forEach(t=>{ String(t.raw).split('\n').forEach(l=>{ const s=l.replace(/^\s*\*?/,'').trim(); if(isStatusStart(s)) return; const m=s.match(NAME_RE); if(m&&/["“「『']/.test(s.slice(m[0].length,m[0].length+3))){ const n=m[1].trim(); cnt[n]=(cnt[n]||0)+1; } }); }); return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,16); }
/* 상태창 시작 줄(T: 18 | 서울 | 38.01.03 … 같은) 찾기 */
const isStatusStart=l=>{ const s=String(l).trim(); return /^T\s*[:：]\s*\d+\s*\|/.test(s) || ((s.match(/\|/g)||[]).length>=3 && /\d{1,2}[.:]\d{2}/.test(s) && s.length<160); };
function splitStatus(text){ const ls=text.split('\n'); const k=ls.findIndex(isStatusStart); if(k<=0&&k!==0) return null; return {body:ls.slice(0,k).join('\n'), tail:ls.slice(k).join('\n')}; }
function statusProse(t){ return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>`<p>${inline(l)}</p>`).join(''); }
let frameN=0;
function renderBlocks(blocks){
  return blocks.map(b=>{
    if(b.k==='prose'){ const sp=splitStatus(b.text); if(sp) return prose(sp.body)+`<div class="st-tail">${statusProse(sp.tail)}</div>`; return prose(b.text); }
    if(b.k==='user'&&isCmd(b.text)) return ''; /* /자동진행 같은 단축어는 보이지 않게 */
    if(b.k==='user') return `<div class="tn-user"><div class="who">USER</div>${prose(b.text,true)}</div>`;
    if(b.k==='status') return `<details class="st" open><summary>${esc(b.title)}</summary><div class="sb">${b.items.map(it=>it.t==='kv'?`<div class="kv"><b>${esc(it.k)}</b><span>${esc(it.v)}</span></div>`:it.t==='li'?`<div class="li">${esc(it.v)}</div>`:it.t==='sec'?`<div class="sec">${esc(it.v)}</div>`:`<div class="pl">${esc(it.v)}</div>`).join('')}</div></details>`;
    if(b.k==='html'&&!/<script|<style|<html|<body/i.test(b.src)) return `<div class="st-inline${/<pre|<details|<table/i.test(b.src)?' code':''}">${sanitize(b.src)}</div>`;
    if(b.k==='html'){ const id='f'+(++frameN); return `<div class="st-html"><iframe sandbox="allow-scripts" scrolling="no" data-fid="${id}" loading="lazy" srcdoc="${esc(frameDoc(b.src,id))}"></iframe></div>`; }
    if(b.k==='code') return `<details class="st st-code"><summary>${esc(b.title)}</summary><pre>${esc(b.src)}</pre></details>`;
    return '';
  }).join('');
}
function sanitize(html){
  const tpl=document.createElement('template'); tpl.innerHTML=html;
  tpl.content.querySelectorAll('script,iframe,object,embed,link,meta,base,form,input,button,textarea,select').forEach(e=>e.remove());
  tpl.content.querySelectorAll('*').forEach(e=>{ [...e.attributes].forEach(a=>{ const n=a.name.toLowerCase(), v=a.value.trim().toLowerCase(); if(n.startsWith('on')||((n==='href'||n==='src'||n==='xlink:href')&&v.startsWith('javascript:'))) e.removeAttribute(a.name); }); });
  return tpl.innerHTML;
}
function frameDoc(html,id){
  const full=/<html[\s>]/i.test(html);
  const sizer=`<script>(function(){function s(){var b=document.body;parent.postMessage({lkH:${JSON.stringify(id)},h:Math.ceil(b.getBoundingClientRect().height+parseFloat(getComputedStyle(b).marginTop)+parseFloat(getComputedStyle(b).marginBottom))},'*')}addEventListener('load',s);new ResizeObserver(s).observe(document.documentElement);setTimeout(s,300);setTimeout(s,1200)})()<\/script>`;
  return full?html.replace(/<\/body>/i,sizer+'</body>'):`<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}body{padding:10px;font-family:Pretendard,'Noto Sans KR',sans-serif;display:flow-root}</style></head><body>${html}${sizer}</body></html>`;
}
window.addEventListener('message',e=>{ const d=e.data; if(!d||!d.lkH) return; const f=document.querySelector(`iframe[data-fid="${d.lkH}"]`); if(f&&e.source===f.contentWindow) f.style.height=Math.min(Math.max(d.h,40),4000)+'px'; });

  $('mauto').onclick=()=>{ c.turns.forEach(x=>{ x.turnNoManual=false; x.turnNo=turnNoOf(x.raw); }); save(); closeModal(); renderMain(true); toast('원본 표시대로 번호를 다시 매겼어요'); };
  $('mo').onclick=()=>{ const v=parseInt($('mn').value,10); if(isNaN(v)){ toast('숫자를 넣어 주세요'); return; }
    if($('mall').checked) c.turns.slice(i).forEach((x,k)=>{ x.turnNo=v+k; x.turnNoManual=true; }); else { t.turnNo=v; t.turnNoManual=true; }
    save(); closeModal(); renderMain(true); };
}

/* ---------- 백업 · 불러오기 ---------- */
$('export').onclick=()=>{ if(!S.chats.length){ toast('저장할 채팅이 없어요'); return; } const d=new Date(), p=n=>String(n).padStart(2,'0'); download(`로그보관함_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`,JSON.stringify(S),'application/json'); toast('백업 파일을 저장했어요'); };
$('import').onclick=()=>$('file').click();
$('file').onchange=()=>{ const f=$('file').files[0]; $('file').value=''; if(!f) return; const r=new FileReader(); r.onload=()=>{
  let d; try{ d=JSON.parse(String(r.result)); }catch(e){ toast('불러올 수 없는 파일이에요'); return; }
  if(d&&d.app==='log-studio-all'&&d.logs) d=d.logs;
  if(!d||!Array.isArray(d.chats)){ toast('로그 보관함 백업 파일이 아니에요'); return; }
  const n=d.chats.reduce((k,c)=>k+(c.turns||[]).length,0);
  modal(`<h3>백업 불러오기</h3><p class="desc">채팅 ${d.chats.length}개 (턴 ${n}개)가 들어 있어요.<br>지금 보관함에 <b>합칠지</b>, 전부 <b>바꿀지</b> 골라 주세요.</p>
    <div class="ft"><button type="button" id="lk-mc">취소</button><span class="sp"></span><button type="button" id="lk-mrep">전부 바꾸기</button><button type="button" class="primary" id="lk-mmerge">합치기</button></div>`);
  $('mc').onclick=closeModal;
  $('mmerge').onclick=()=>{ const ec=new Set(S.chats.map(c=>c.id)), ef=new Set(S.folders.map(f=>f.id)); let a=0;
    (d.folders||[]).forEach(f=>{ if(!ef.has(f.id)) S.folders.push(f); }); d.chats.forEach(c=>{ if(!ec.has(c.id)){ S.chats.push(c); a++; } });
    save(); closeModal(); if(!UI.active&&S.chats[0]) UI.active=S.chats[0].id; renderAll(); toast(`채팅 ${a}개를 합쳤어요`); };
  $('mrep').onclick=()=>confirmModal('지금 보관함을 전부 바꿀까요?','지금 있는 채팅은 사라지고 백업 내용으로 바뀌어요.','바꾸기',()=>{ S={v:1,chats:d.chats,folders:d.folders||[]}; UI.active=S.chats[0]?S.chats[0].id:null; saveUI(); save(); renderAll(); toast('백업으로 바꿨어요'); });
}; r.readAsText(f); };

/* ---------- 사이트에서 바로 가져오기 (북마클릿 → ?lkimport=1) ---------- */
const SITE_RE=/^https:\/\/([a-z0-9-]+\.)*(caveduck\.io|teapotchat\.com|fairytale\.ai\.kr|wrtn\.ai|rofan\.ai)$/i;
const SITE_ORIGINS=['https://crack.wrtn.ai','https://wrtn.ai','https://www.wrtn.ai','https://caveduck.io','https://www.caveduck.io','https://teapotchat.com','https://www.teapotchat.com','https://fairytale.ai.kr','https://www.fairytale.ai.kr','https://rofan.ai','https://www.rofan.ai'];
let LOADED=false;
function importFromSite(p){
  const text=String(p.text||'').replace(/\r\n/g,'\n').trim(); if(!text) return 0;
  const pid=String(p.id||''); const site=pid.startsWith('cr')?'크랙':pid.startsWith('rf')?'로판':pid.startsWith('tp')?'티팟':'케이브덕';
  const title=String(p.title||'').trim()||site+' 로그';
  const parts=p.mode==='bulk'?mergeCont(splitBulk(text)):[text];
  /* 이미 받아둔 같은 채팅이 있으면 이어 붙이기 */
  let best=null, bs=0;
  S.chats.forEach(c=>{ const o=overlap(c,parts); const sc=o*2+(c.title===title?1:0); if(o>0&&sc>bs){ best=c; bs=sc; } });
  if(best){
    const r=newPart(best,parts); const base=lastNo(best)+1;
    r.fresh.forEach((raw,i)=>best.turns.push({id:uid(),raw,createdAt:now(),turnNo:base+i,turnNoManual:true}));
    if(r.fresh.length) best.updatedAt=now();
    UI.active=best.id; saveUI(); clearTimeout(_st); doSave(); renderAll();
    const sc=$('scroll'); if(sc) sc.scrollTop=sc.scrollHeight;
    afterAppend(best,r.fresh.length,r.skip,parts,site,title,p.emoji);
    return r.fresh.length;
  }
  return newChatFrom(parts,site,title,p.emoji,p.mode==='bulk');
}
function newChatFrom(parts,site,title,emoji,bulk){
  const c={id:uid(),title,emoji:String(emoji||'').trim()||({'크랙':'🍪','로판':'🌹','티팟':'🫖'}[site]||'🦆'),createdAt:now(),updatedAt:now(),turns:[]};
  parts.forEach((r,i)=>c.turns.push({id:uid(),raw:r,createdAt:now(),turnNo:bulk?i:turnNoOf(r),turnNoManual:!!bulk}));
  S.chats.push(c); UI.active=c.id; saveUI(); clearTimeout(_st); doSave(); renderAll(); const sc=$('scroll'); if(sc) sc.scrollTop=0;
  toast(`${site}에서 ${c.turns.length}개 턴을 받아 '${c.title}'에 담았어요`);
  return c.turns.length;
}
function afterAppend(c,added,skip,parts,site,title,emoji){
  modal(`<h3>${added?'🍪 새 턴만 이어 붙였어요':'새로운 턴이 없어요'}</h3>
    <p class="desc">'${esc(c.title)}'에 이미 있던 로그와 비교했어요.<br>${added?`마지막으로 받은 턴 <b>바로 다음부터 ${added}개</b>를 붙였어요.`:'보관함에 이미 마지막 턴까지 다 있어요.'}${skip?` (겹친 턴 ${skip}개는 건너뛰었어요)`:''}</p>
    <div class="ft">${added?'<button type="button" id="lk-mundo">따로 새 채팅으로 만들기</button>':''}<span class="sp"></span><button type="button" class="primary" id="lk-mc">확인</button></div>`);
  $('mc').onclick=closeModal;
  if(added) $('mundo').onclick=()=>{ c.turns.splice(c.turns.length-added,added); save(); closeModal(); newChatFrom(parts,site,title,emoji,true); };
}
if(new URLSearchParams(location.search).get('lkimport')==='1'){
  const done={};
  window.addEventListener('message',ev=>{
    if(!SITE_RE.test(ev.origin)) return; const d=ev.data; if(!d||typeof d!=='object'||d.type!=='lk-import') return;
    const reply=n=>{ try{ ev.source.postMessage({type:'lk-imported',id:d.id,count:n},ev.origin); }catch(e){} };
    if(done[d.id]!=null){ reply(done[d.id]); return; }
    done[d.id]=0;
    const go=()=>{ if(!LOADED){ setTimeout(go,60); return; } let n=0; try{ n=importFromSite(d); }catch(e){ console.warn(e); } done[d.id]=n; reply(n); };
    go();
  });
  let k=0; const hello=()=>{ if(window.opener) SITE_ORIGINS.forEach(o=>{ try{ window.opener.postMessage({type:'lk-ready'},o); }catch(e){} }); };
  const iv=setInterval(()=>{ if(LOADED) hello(); if(++k>24) clearInterval(iv); },500);
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
}
/* 기존 로그 추출 북마클릿을 이 보관함으로 보내도록 바꿔 주기 */
function siteModal(){
  const here=location.origin+location.pathname;
  modal(`<h3>🔗 사이트에서 바로 가져오기</h3>
    <p class="desc">크랙 · 케이브덕 · 티팟 · 로판에서 쓰던 <b>로그 추출 즐겨찾기(북마클릿)</b>를 이 보관함으로 보내도록 바꿔 드려요.<br>예전 로그보관함의 로그 추출 메뉴에서 북마클릿 코드를 복사해 아래에 붙여넣으세요.</p>
    <div class="f"><textarea id="lk-bmIn" style="min-height:120px;font:12px/1.5 ui-monospace,monospace" placeholder="javascript:(async()=>{ ... })()"></textarea></div>
    <div class="f" id="lk-bmOut" style="display:none"></div>
    <p class="desc" style="margin-top:10px">보낼 주소: <code style="font-size:11.5px">${esc(here)}</code></p>
    <div class="ft"><span class="sp"></span><button type="button" id="lk-mc">닫기</button><button type="button" class="primary" id="lk-bmGo">바꾸기</button></div>`);
  $('mc').onclick=closeModal;
  $('bmGo').onclick=()=>{
    let code=$('bmIn').value.trim(); if(!code){ toast('북마클릿 코드를 붙여넣어 주세요'); return; }
    if(!/^javascript:/i.test(code)){ toast('javascript: 로 시작하는 북마클릿 코드가 아니에요'); return; }
    const m=code.match(/"(https:\/\/[a-z0-9.-]+)"\s*,\s*([a-zA-Z_$][\w$]*)\s*=\s*[a-zA-Z_$][\w$]*\s*\+\s*"(\/[^"]*\?lkimport=1)"/);
    if(!m){ toast('보내는 주소를 찾지 못했어요. 로그 추출 북마클릿이 맞는지 확인해 주세요'); return; }
    const out=code.split('"'+m[1]+'"').join('"'+location.origin+'"').split('"'+m[3]+'"').join('"'+location.pathname+'?lkimport=1"');
    const site=/cr-ov|크랙/.test(out)?'🍪 크랙':/rf-ov|로판/.test(out)?'🌹 로판':/tp-ov|티팟/.test(out)?'🫖 티팟':/케이브덕|cd-/.test(out)?'🦆 케이브덕':'로그';
    const box=$('bmOut'); box.style.display='';
    box.innerHTML=`<label>바뀐 즐겨찾기</label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><a id="lk-bmLink" draggable="true" style="display:inline-block;padding:9px 16px;border-radius:999px;background:#e7f1fb;color:#2f5f96;font-weight:700;text-decoration:none;cursor:grab">${esc(site)} → Log Studio</a><button type="button" id="lk-bmCopy">코드 복사</button></div>
      <p class="desc" style="margin:10px 0 0">위 버튼을 <b>브라우저 즐겨찾기 막대로 끌어다 놓거나</b>, 코드를 복사해 새 즐겨찾기의 주소(URL) 칸에 붙여넣으세요.<br>그다음 ${esc(site.slice(2))} 채팅방에서 즐겨찾기를 누르고, 추출 창의 <b>보관함으로 보내기</b>를 누르면 이 보관함에 새 채팅으로 담겨요.</p>`;
    $('bmLink').setAttribute('href',out); $('bmLink').onclick=e=>{ e.preventDefault(); toast('클릭 말고 즐겨찾기 막대로 끌어다 놓아 주세요'); };
    $('bmCopy').onclick=()=>copyText(out,'바뀐 북마클릿 코드를 복사했어요');
  };
}

/* ---------- 시작 ---------- */
$('newChat').onclick=()=>chatModal(null);
$('newFolder').onclick=()=>folderModal(null);
$('q').oninput=()=>{ UI.q=$('q').value; renderSide(); };
(async()=>{
  await load();
  if(!chat()) UI.active=S.chats[0]?S.chats[0].id:null;
  const hm=(location.hash||'').match(/^#c=([\w-]+)$/); if(hm&&S.chats.some(c=>c.id===hm[1])) UI.active=hm[1];
  LOADED=true;
  renderAll(); restorePos(chat());
})();
$('site').onclick=siteModal;
})();
</script>
</body>
